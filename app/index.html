<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d100f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OpenTicker">
<link rel="manifest" href="/static/app.webmanifest">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<title>OpenTicker</title>
<link rel="preload" href="/static/fonts/inter-variable.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* One typeface everywhere: Inter (variable, bundled locally, SIL OFL). Numbers use its tabular figures. */
@font-face{font-family:"Inter";src:url(/static/fonts/inter-variable.woff2) format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
/* Layout: a market desk. Sticky controls, a pulse strip across the four funds, a written read of the tape,
   then map + drivers, leadership + rotation, and the full roster. A drawer slides in for any one stock. */
:root{
  --bg:#f4f5f2; --panel:#ffffff; --raise:#fbfbfa; --ink:#121513; --ink-2:#4b524e; --ink-3:#7c847f;
  --rule:#e1e4df; --grid:#eceeea; --accent:#2b59d6; --accent-soft:#e7ecfb;
  --up:#12804e; --up-soft:#dcefe4; --down:#c53b31; --down-soft:#f7e1de; --fund:#121513;
  --tile-0:#e9ebe7; --tile-up:#0f8a52; --tile-down:#d23a2f; --tile-ink:#ffffff; --tile-ink-0:#2b302d; --warn:#b7791f;
  --shadow:0 1px 2px rgba(18,21,19,.05),0 8px 24px rgba(18,21,19,.06); --glow:rgba(43,89,214,.07);
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-display:var(--f-body);
  --f-mono:var(--f-body);
  --f-code:ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d100f; --panel:#151917; --raise:#1a1f1c; --ink:#eef1ee; --ink-2:#b2bab4; --ink-3:#7c857f;
  --rule:#252b28; --grid:#1f2522; --accent:#86a5f3; --accent-soft:#1c2540;
  --up:#41c585; --up-soft:#15301f; --down:#f2685d; --down-soft:#391b18; --fund:#eef1ee;
  --tile-0:#262c29; --tile-up:#1f9e62; --tile-down:#d9473c; --tile-ink:#ffffff; --tile-ink-0:#d5dad6; --warn:#e0a948;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --glow:rgba(134,165,243,.09); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d100f; --panel:#151917; --raise:#1a1f1c; --ink:#eef1ee; --ink-2:#b2bab4; --ink-3:#7c857f;
  --rule:#252b28; --grid:#1f2522; --accent:#86a5f3; --accent-soft:#1c2540;
  --up:#41c585; --up-soft:#15301f; --down:#f2685d; --down-soft:#391b18; --fund:#eef1ee;
  --tile-0:#262c29; --tile-up:#1f9e62; --tile-down:#d9473c; --tile-ink:#ffffff; --tile-ink-0:#d5dad6; --warn:#e0a948;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --glow:rgba(134,165,243,.09); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;font-optical-sizing:auto}
/* tabular figures only where numbers line up or tick live (Inter's tabular set also widens hyphens in words) */
td.num,th.num,.v,.kv,.tv,.tc,.mval,.p,.pe,.sv,input[type=number]{font-variant-numeric:tabular-nums}
p,.hint,.lead,li{text-wrap:pretty}
.wrap{max-width:1680px;margin:0 auto;padding-inline:max(20px,env(safe-area-inset-left,0px)) max(20px,env(safe-area-inset-right,0px))}
main.wrap{padding-block:0 56px;display:flex;flex-direction:column;gap:16px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--ink-2)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* tabular figures for data; prose keeps natural spacing (Inter's tabular set also widens hyphens) */
p,.ins li,.bt,.blead,.bl,.ptitle,h2,h3,.sub,.read p,.sn,.qn{font-variant-numeric:normal}
kbd{font:500 11px var(--f-body);border:1px solid var(--rule);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--ink-2);background:var(--raise)}

/* header */
header.bar{position:sticky;top:0;z-index:15;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--rule)}
.bar-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:12px}
.brand{display:flex;align-items:center;gap:9px;margin-right:auto}
.brand .logo{flex:none;display:block;border-radius:7px;box-shadow:0 0 0 1px color-mix(in srgb,var(--ink) 10%,transparent),0 1px 2px rgba(0,0,0,.12)}
.brand b{font:700 19px/1 var(--f-display);letter-spacing:-.02em}
.brand span{font:500 11px/1 var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:9px;background:var(--panel);padding:2px;gap:2px}
.seg button{border:0;background:none;padding:6px 11px;border-radius:7px;cursor:pointer;font:600 13px/1 var(--f-body);color:var(--ink-2);transition:background .15s,color .15s}
.seg button:hover{color:var(--ink);background:var(--grid)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button.wi{display:inline-flex;align-items:center;gap:6px}
.live{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:none}
.dot.on{background:var(--up);animation:pulse 2s infinite}
.dot.warn{background:var(--warn)}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--up) 55%,transparent)}100%{box-shadow:0 0 0 9px transparent}}

/* pulse strip */
.pulse{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:18px}
.pcard{position:relative;text-align:left;border:1px solid var(--rule);background:var(--panel);border-radius:14px;padding:14px 16px 10px;cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s;min-width:0}
.pcard:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.pcard[aria-pressed="true"]{border-color:var(--ink);box-shadow:var(--shadow)}
.pcard .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pcard .tk{font:700 16px/1 var(--f-display);letter-spacing:-.01em}
.pcard .nm{font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .r{font:600 26px/1.1 var(--f-mono);margin-top:8px;letter-spacing:-.02em}
.pcard .meta{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-2);margin-top:2px;gap:8px}
.pcard svg{display:block;width:100%;height:38px;margin-top:6px;overflow:hidden}
.sp{display:inline-block;width:90px;height:24px;vertical-align:middle}.sp svg{display:block;width:90px;height:24px}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:28px;align-items:stretch;padding:26px 28px;background:var(--panel);border:1px solid var(--rule);border-radius:18px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(900px 300px at 0% 0%,var(--glow),transparent 60%);pointer-events:none}
.hero>*{position:relative;min-width:0}
.eyebrow{display:flex;align-items:center;gap:10px;font:600 11px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.big-r{font:700 clamp(30px,3vw,40px)/1.05 var(--f-mono);letter-spacing:-.03em;margin:12px 0 6px;font-variant-numeric:tabular-nums}
.big-sub{color:var(--ink-2);font-size:13px;display:flex;align-items:center;gap:7px}.big-sub>.ic{color:var(--ink-3)}
.hero .read{margin-top:18px;display:block;background:none;border:0;padding:0}
.hero .read p{font:500 17px/1.55 var(--f-body);color:var(--ink);max-width:62ch;margin:10px 0 0}
.hero .read p b{font-weight:650}
.tag{display:inline-flex;align-items:center;gap:6px;font:700 11px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;padding:6px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.hchart{display:flex;flex-direction:column;min-height:260px}
.hchart .legend{margin-bottom:6px}
.hchart svg{flex:1}
.sw{display:inline-block;width:16px;height:3px;border-radius:2px}

/* section nav + tape */
.subnav{position:sticky;top:var(--hdr,57px);z-index:12;display:flex;align-items:center;gap:4px 12px;padding:8px 0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);margin-top:-6px}
.sublinks{display:flex;gap:4px;min-width:0;flex:1 1 auto;overflow-x:auto;scrollbar-width:none}.sublinks::-webkit-scrollbar{display:none}
.subnav #horizons{flex:none;margin-left:auto}
.subnav a{display:inline-flex;align-items:center;gap:6px;font:600 12.5px/1 var(--f-body);color:var(--ink-3);text-decoration:none;padding:7px 11px;border-radius:999px;transition:color .15s,background .15s}
.subnav a.on .ic{color:var(--accent)}
.subnav a:hover{color:var(--ink)}
.subnav a.on{color:var(--ink);background:var(--panel);box-shadow:inset 0 0 0 1px var(--rule)}
section[id^="s-"]{scroll-margin-top:120px}
.tape{border-top:1px solid var(--rule);overflow:hidden;white-space:nowrap;font:500 12px/1 var(--f-mono);color:var(--ink-2);mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
.tape-in{display:inline-flex;gap:26px;padding:8px 0;animation:tape 70s linear infinite}
.tape:hover .tape-in{animation-play-state:paused}
.tape b{color:var(--ink);font-weight:600;margin-right:6px;cursor:pointer}
.tape .lab{font-family:var(--f-body);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:10.5px;color:var(--ink-3)}
@keyframes tape{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.theme{border:1px solid var(--rule);background:var(--panel);border-radius:9px;height:30px;padding:0 10px;cursor:pointer;font:600 12px var(--f-body);color:var(--ink-2)}
.theme:hover{color:var(--ink)}

/* hover cross-highlight */
.tile.hl{outline:2px solid var(--ink);z-index:4;filter:brightness(1.08)}
g.hl>rect:first-child{fill:var(--grid)}
tr.hl{background:var(--grid)}
#rotation .tail{display:none}#rotation .tail.on{display:inline}
.hl-on #rotation g[data-sel]:not(.hl) .hd{opacity:.18;transition:opacity .15s}.hl-on #rotation g[data-sel]:not(.hl) .tail{display:none}
.hl-on #rotation g.hl .tail{display:inline}.hl-on #rotation g.hl .hd{stroke:var(--ink);stroke-width:2;fill-opacity:.95}
.mx tr.hl td.l{color:var(--accent)}
.tile.tick-up{animation:tu 1.2s}.tile.tick-down{animation:td 1.2s}
@keyframes tu{0%{box-shadow:inset 0 0 0 3px var(--up-soft)}100%{box-shadow:inset 0 0 0 0 transparent}}
@keyframes td{0%{box-shadow:inset 0 0 0 3px var(--down-soft)}100%{box-shadow:inset 0 0 0 0 transparent}}

/* skeleton */
.skel{display:grid;gap:16px;margin-top:18px}
.skel i{display:block;border-radius:14px;background:linear-gradient(90deg,var(--grid),var(--raise),var(--grid));background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes sh{from{background-position:100% 0}to{background-position:-100% 0}}

/* headline */
.read{display:flex;gap:14px;align-items:flex-start;background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:16px 18px}
.read p{margin:0;font:500 16px/1.5 var(--f-body);text-wrap:pretty;max-width:110ch}
.read p b{font-weight:600}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;padding:4px 0}
.kpis>div{padding:6px 18px;min-width:0;border-left:1px solid var(--rule)}
.kpis>div:first-child{border-left:0;padding-left:4px}
.lbl{font:600 10.5px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);display:flex;gap:6px;align-items:center}
.kv{font:600 22px/1.1 var(--f-mono);margin-top:8px;letter-spacing:-.01em}
.ks{color:var(--ink-2);font-size:12px;margin-top:5px}
.meter{height:6px;border-radius:3px;background:var(--grid);margin-top:9px;overflow:hidden;display:flex;gap:2px}
.meter i{display:block;height:100%;border-radius:3px}
.duo{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center;margin-top:8px;font-size:12px;color:var(--ink-2)}
.duo .meter{margin:0}
.chip{display:inline-flex;align-items:center;gap:5px;font:600 11px/1 var(--f-body);padding:4px 7px;border-radius:999px;background:var(--grid);color:var(--ink-2);white-space:nowrap}
.chip.up{background:var(--up-soft);color:var(--up)} .chip.down{background:var(--down-soft);color:var(--down)}

/* panels */
.row{display:grid;gap:16px;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.row.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:18px;padding:20px 22px;min-width:0}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.ph h2{font:700 17px/1.25 var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.ph h2>.ic{display:inline-block;vertical-align:-2px;margin-right:9px;color:var(--ink-3)}
.hint{color:var(--ink-3);font-size:12px;margin-top:3px;max-width:70ch}
svg text{font-family:var(--f-body)}
svg .mono{font-family:var(--f-mono)}
.chart{width:100%;display:block}
.fin-chart .hov{fill:var(--ink);opacity:0;transition:opacity .12s}.fin-chart .hov:hover{opacity:.05}
[data-sel]{cursor:pointer}
.legend{display:flex;gap:12px;font-size:11.5px;color:var(--ink-2);flex-wrap:wrap;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.ramp{width:120px;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--tile-down),var(--tile-0),var(--tile-up))}

/* treemap */
.map{position:relative;height:480px;overflow:hidden;background:var(--panel)}
.sec{position:absolute}
.sec-l{position:absolute;left:1px;top:0;right:1px;height:18px;padding:3px 4px;font:700 10px/12px var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:1}
.tile{position:absolute;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;transition:filter .12s;text-align:center;line-height:1.1}
.tile:hover{filter:brightness(1.08) saturate(1.1);z-index:2}
.tile .a{font-family:var(--f-display);font-weight:700;letter-spacing:-.01em}
.tile .b{font-family:var(--f-mono);font-weight:500;opacity:.92}
.tile.sel{outline:2px solid var(--ink);z-index:3}

/* matrix */
.mx-wrap{overflow-x:auto}
table.mx{border-collapse:separate;border-spacing:2px;width:100%;min-width:560px}
.mx th{font:600 10.5px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:4px 6px;text-align:center}
.mx th.l{text-align:left}
.mx td{padding:0;height:26px;text-align:center;font:500 11.5px var(--f-mono);border-radius:4px}
.mx td.l{text-align:left;padding:0 6px;font:600 12.5px var(--f-mono);white-space:nowrap}
.mx td.l small{font:400 11px var(--f-body);color:var(--ink-3);margin-left:6px}
.mx td.w{color:var(--ink-2);font-size:11px}
.mx tr:hover td.l{color:var(--accent)}
.mx th.cur{color:var(--ink)}
.rs{display:inline-block;min-width:26px;padding:3px 5px;border-radius:5px;font:600 11px var(--f-mono)}

/* table */
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--rule);background:var(--panel);padding:5px 10px;border-radius:999px;cursor:pointer;font:600 12px var(--f-body);color:var(--ink-2)}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input[type=search]{font:inherit;padding:7px 10px;border:1px solid var(--rule);border-radius:9px;background:var(--bg);color:var(--ink);width:220px;max-width:100%}
.tbl-wrap{overflow:auto;margin-top:6px;max-height:680px;border-top:1px solid var(--grid)}
.tbl-wrap.more-below{-webkit-mask-image:linear-gradient(#000 calc(100% - 36px),transparent);mask-image:linear-gradient(#000 calc(100% - 36px),transparent)}
.hc{display:inline-block;padding:2px 6px;border-radius:5px;min-width:64px}
table.hold{border-collapse:collapse;width:100%;min-width:1060px}
.hold th,.hold td{padding:7px 9px;text-align:right;border-bottom:1px solid var(--grid);white-space:nowrap}
.hold th{font:600 10.5px/1.2 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);cursor:pointer;user-select:none;position:sticky;top:0;background:var(--panel)}
.hold th:hover{color:var(--ink)}
.hold th.l,.hold td.l{text-align:left}
.hold td.name{color:var(--ink-2);max-width:200px;overflow:hidden;text-overflow:ellipsis}
.hold td.sector{color:var(--ink-3);font-size:12px;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.hold tbody tr{cursor:pointer;transition:background .1s}
.hold tbody tr:hover{background:var(--grid)}
.hold tbody tr.sel{background:var(--accent-soft)}
.hold td.tk{font:600 13px var(--f-mono)}
.cbar{display:inline-block;height:8px;border-radius:2px;vertical-align:middle;margin-left:6px}
.rng+.num{display:inline-block;min-width:54px;text-align:right}
.rng{display:inline-block;position:relative;width:64px;height:6px;border-radius:3px;background:var(--grid);vertical-align:middle;margin-right:6px}
.rng i{position:absolute;top:-2px;width:3px;height:10px;border-radius:2px;background:var(--ink)}
.flash-up{animation:fu 1.4s}.flash-down{animation:fd 1.4s}
@keyframes fu{0%{background:var(--up-soft)}100%{background:transparent}}
@keyframes fd{0%{background:var(--down-soft)}100%{background:transparent}}
.more{margin-top:10px;border:1px solid var(--rule);background:var(--bg);padding:7px 12px;border-radius:9px;cursor:pointer}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,12,11,.32);opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,100vw);background:var(--panel);border-left:1px solid var(--rule);box-shadow:-20px 0 40px rgba(0,0,0,.12);transform:translateX(104%);transition:transform .25s cubic-bezier(.2,.8,.2,1);z-index:31;overflow-y:scroll;padding:20px 22px 40px;padding-right:max(22px,env(safe-area-inset-right,0px))}
.drawer.open{transform:none}
.dr-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dr-h h3{margin:0;font:700 28px/1 var(--f-display);letter-spacing:-.02em}
.dr-h .nm{color:var(--ink-2);margin-top:4px}
.x{border:1px solid var(--rule);background:var(--raise);border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:18px;line-height:1}
.dr-price{display:flex;align-items:baseline;gap:10px;margin-top:14px}
.dr-price .p{font:600 30px/1 var(--f-mono)}
.dr-price:has(.pq){align-items:flex-end;flex-wrap:wrap;gap:12px 32px}
.dr-price .pr{display:flex;align-items:baseline;gap:10px}
.dr-price .pw{font-size:12px;color:var(--ink-3);margin-top:7px}
.dr-price .pe{display:inline-flex;align-items:center;gap:6px;font:600 20px/1 var(--f-mono)}
.dr-price .pe svg{color:var(--ink-3)}
.mine-k .ks .num{white-space:nowrap}
.xh{display:block;font-size:11.5px;color:var(--ink-3);margin-top:2px;white-space:nowrap}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.dr-sec{margin-top:20px}
.dr-sec h4{margin:0 0 8px;font:600 10.5px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
table.hz{width:100%;border-collapse:collapse;font-size:13px}
.hz th,.hz td{padding:6px 4px;text-align:right;border-bottom:1px solid var(--grid)}

body.tick-resizing,body.tick-resizing *{cursor:col-resize!important;user-select:none!important;-webkit-user-select:none!important}
body.tick-moving,body.tick-moving *{cursor:grabbing!important;user-select:none!important;-webkit-user-select:none!important}
.ask.docked .ask-h{cursor:grab}
.ask.docked .ask-h button{cursor:pointer}
.ask.moving{transition:none!important;box-shadow:0 28px 70px rgba(0,0,0,.3);z-index:40}
.tick-drop{position:fixed;top:var(--tick-gap);bottom:var(--tick-gap);width:var(--tick-w);box-sizing:border-box;border:2px dashed color-mix(in srgb,var(--ink) 22%,transparent);border-radius:18px;background:color-mix(in srgb,var(--ink) 4%,transparent);z-index:39;pointer-events:none;transition:left .18s,right .18s}
.ask{--tk-line:color-mix(in srgb,var(--ink) 9%,transparent);--tk-fill:color-mix(in srgb,var(--ink) 4%,var(--panel));
  position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:38;background:var(--panel);border-left:1px solid var(--rule);box-shadow:-24px 0 48px rgba(0,0,0,.14);display:flex;flex-direction:column;font-size:14px;transform:translateX(104%);visibility:hidden;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s .3s}
.ask.open{transform:none;visibility:visible;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.ask.docked{top:var(--tick-gap);right:var(--tick-gap);bottom:var(--tick-gap);width:var(--tick-w);z-index:25;border:1px solid var(--rule);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.ask.docked.left{right:auto;left:var(--tick-gap)}

/* header: name, the agent as a pill, three quiet buttons */
.ask-h{display:flex;align-items:center;gap:6px;padding:10px 8px 10px 16px;min-height:52px;box-sizing:border-box;position:relative;border-bottom:1px solid transparent;transition:border-color .2s}
.ask-h.lined{border-bottom-color:var(--grid)}
.ask-nm{font:700 15px/1 var(--f-body);letter-spacing:-.015em;color:var(--ink);margin-right:2px}
.ask-prov{display:inline-flex;align-items:center;gap:6px;height:28px;max-width:180px;border:0;background:none;font:500 12.5px var(--f-body);color:var(--ink-2);cursor:pointer;padding:0 7px 0 8px;border-radius:8px;white-space:nowrap;transition:background .15s,color .15s}
.ask-prov span{overflow:hidden;text-overflow:ellipsis}
.ask-prov .ic{color:var(--ink-3);flex:none}
.ask-prov:hover,.ask-prov[aria-expanded="true"]{background:var(--tk-fill);color:var(--ink)}
.ask :focus-visible{outline:2px solid color-mix(in srgb,var(--ink) 28%,transparent);outline-offset:1px}
.pdot{width:6px;height:6px;border-radius:50%;background:var(--ink-3);flex:none}
.agi{flex:none;display:block;border-radius:3px}
.ask-prov .agi{margin-right:1px}
/* agent and model menus, after HyperFrames: big agent rows with a check, a short model list with a dot */
.ask-prov,.ask-menu{font-variant-numeric:normal}
.ask-prov.ask-ag{gap:3px;padding:0 5px 0 6px;margin-left:2px}
#askMod{gap:4px;margin-left:-2px;font-weight:600;color:var(--ink)}
.provm{width:300px;overflow-x:hidden}
.agm{padding:7px}
.ask-menu .agrow{flex-direction:row;align-items:center;gap:12px;padding:9px 12px 9px 10px;border-radius:11px}
.ask-menu .agrow.on,.ask-menu .agrow.on:hover{background:color-mix(in srgb,var(--up) 15%,var(--panel))}
.ask .ask-menu button.agrow b::after,.ask .ask-menu button.mrow b::after{display:none}
.agic{width:26px;height:26px;display:grid;place-items:center;flex:none}
.agt{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
.agt b,.agt small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agk{margin-left:auto;display:flex;align-items:center;gap:7px;color:var(--ink-3);flex:none}
.agrow.on .agk{color:var(--up)}
.ring{width:6px;height:6px;border:1.5px solid currentColor;border-radius:50%;opacity:.8}
.ask-menu .mi{padding:9px 12px}
.ask-menu.mdm{width:224px;padding:6px}
.ask-menu .mrow{flex-direction:row;align-items:baseline;gap:8px;padding:8px 12px}
.ask-menu .mrow[aria-checked="true"]{background:none}
.ask-menu .mrow[aria-checked="true"]:hover{background:var(--tk-fill)}
.ask-menu .mrow b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ask-menu .mrow small{font-size:12.5px;color:var(--ink-3)}
.mdot{margin-left:auto;align-self:center;width:7px;height:7px;border-radius:50%;background:var(--up);flex:none}
.ask-menu .mmore{flex-direction:row;align-items:center;gap:5px;padding:8px 12px;color:var(--ink-2)}
.ask-menu .mmore b{font-weight:500}
.ask-menu .mmore .ic{transition:transform .15s;color:var(--ink-3)}
.ask-menu .mmore[aria-expanded="true"] .ic{transform:rotate(180deg)}
.mdm .mh{padding:12px 12px 4px;font-weight:500;font-size:12px}
.pdot.on{background:var(--up)}
.ask-hb{display:flex;gap:2px;margin-left:auto}
.ask-hb .x{width:30px;height:30px;border:0;background:none;border-radius:8px;cursor:pointer;color:var(--ink-3);display:grid;place-items:center;transition:background .15s,color .15s}
.ask-hb .x:hover,.ask-hb .x.on{background:var(--tk-fill);color:var(--ink)}

.ask-b{flex:1;overflow-y:scroll;padding:14px 18px 42px;overscroll-behavior:contain}

/* the composer: one rounded box; the words on top, what Tick looks at and send underneath */
.ask-f{padding:0 12px calc(12px + env(safe-area-inset-bottom,0px));position:relative}
.ask-f.off .ask-in{opacity:.45;pointer-events:none}
.ask-in{position:relative;border:1px solid var(--tk-line);border-radius:18px;background:var(--tk-fill);padding:12px 10px 10px 14px;transition:border-color .15s,background .15s}
.ask-in:focus-within{border-color:color-mix(in srgb,var(--ink) 22%,transparent);background:var(--panel)}
#askQ{display:block;width:100%;box-sizing:border-box;border:0;background:none;resize:none;font:400 14px/1.5 var(--f-body);color:var(--ink);outline:none;max-height:180px;min-height:42px;padding:0 2px 0 0;margin:0}
#askQ::placeholder{color:var(--ink-3)}
.ask-row{display:flex;align-items:center;gap:6px;margin-top:8px;min-height:30px}
.ask-ctxr{display:flex;flex-wrap:wrap;gap:5px;min-width:0;flex:1}
.ctxchip{display:inline-flex;align-items:center;gap:5px;height:28px;border:1px solid var(--tk-line);background:var(--panel);border-radius:9px;padding:0 8px;font:500 12.5px var(--f-body);color:var(--ink-2);cursor:pointer;max-width:100%;box-sizing:border-box;transition:border-color .15s,color .15s}
.ctxchip b{font-weight:600;color:var(--ink)}
.ctxchip small{color:var(--ink-3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctxchip .ic{color:var(--ink-3);flex:none}
.ctxchip.main:hover{border-color:color-mix(in srgb,var(--ink) 25%,transparent)}
.ctxchip button{border:0;background:none;color:var(--ink-3);cursor:pointer;font-size:15px;line-height:1;padding:0 0 1px 2px}
.ctxchip button:hover{color:var(--ink)}
.ask-send{width:30px;height:30px;border-radius:50%;border:0;background:color-mix(in srgb,var(--ink) 9%,transparent);color:var(--ink-3);display:grid;place-items:center;cursor:pointer;flex:none;margin-left:auto;transition:background .15s,color .15s,transform .15s}
.ask-send.ready{background:var(--ink);color:var(--bg)}
.ask-send.ready:active{transform:scale(.92)}
.ask-send.stop{background:var(--ink);color:var(--bg)}

/* Tick perches on the composer's top edge and says what he's doing */
.perch{position:absolute;left:18px;top:-32px;z-index:2;display:flex;align-items:flex-end;gap:8px;pointer-events:none}
.perch .tick{pointer-events:auto;cursor:default}
.say{font:600 12px/1 var(--f-body);color:var(--bg);background:var(--ink);padding:7px 10px;border-radius:9px 9px 9px 3px;margin-bottom:18px;white-space:nowrap;max-width:270px;overflow:hidden;text-overflow:ellipsis;box-shadow:0 4px 14px rgba(0,0,0,.14);opacity:0;transform:translateY(4px) scale(.96);transform-origin:left bottom;transition:opacity .2s,transform .25s cubic-bezier(.2,.8,.2,1)}
.say.on{opacity:1;transform:none}
.say.err{background:var(--down);color:#fff}

/* menus */
.ask-menu{position:absolute;z-index:6;background:var(--panel);border:1px solid var(--rule);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.16),0 1px 3px rgba(0,0,0,.06);padding:6px;width:300px;max-width:calc(100vw - 28px);max-height:62vh;overflow:auto;animation:rise .18s cubic-bezier(.2,.8,.2,1) both}
.provm{left:10px;top:48px}
.ctxm{left:12px;bottom:calc(100% - 52px)}
.pop{left:12px;right:12px;width:auto;bottom:calc(100% + 6px);max-height:340px;padding:6px 6px 0}
.pop button.on{background:var(--tk-fill)}
.pop button[aria-disabled="true"]{opacity:.45}
.pop .pk{flex:none;min-width:48px;font:650 12.5px var(--f-body);color:var(--ink)}
.pop .pf{position:sticky;bottom:0;display:flex;gap:10px;align-items:center;margin:4px -6px 0;padding:8px 12px;border-top:1px solid var(--grid);background:var(--panel);font-size:11.5px;color:var(--ink-3)}
.pop .pf kbd{font-size:10.5px}
@media (hover:none){.pop .pf{display:none}.pop{padding-bottom:6px}}
.mtip{margin:2px 10px 8px;font-size:12.5px;color:var(--ink-3);line-height:1.45}
.ask-menu .mh{font:600 11px var(--f-body);color:var(--ink-3);padding:8px 10px 4px}
.ask-menu hr{border:0;border-top:1px solid var(--grid);margin:6px 4px}
.ask-menu button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;width:100%;border:0;background:none;text-align:left;padding:8px 10px;border-radius:9px;cursor:pointer;color:var(--ink)}
.ask-menu button:has(>.ic){flex-direction:row;align-items:center;gap:9px}
.ask-menu button:has(>.ic) .ic{color:var(--ink-3)}
.ask-menu button:hover:not(:disabled){background:var(--tk-fill)}
.ask-menu button[aria-checked="true"]{background:var(--tk-fill)}
.ask-menu button[aria-checked="true"] b::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--up);margin-left:7px;vertical-align:2px}
.ask-menu button:disabled{opacity:.5;cursor:default}
.ask-menu b{font-weight:600;font-size:13px}
.ask-menu small{font-size:12px;color:var(--ink-3)}
.ask-menu .pairbox{margin:6px 4px 4px}
.pop button:has(.pk){flex-direction:row;align-items:baseline;gap:10px}
.pop button small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

/* Tick himself: a rounded candle with a wick, two eyes with a glint, and a smile he saves for good news */
.tick{display:inline-grid;place-items:center;width:var(--s);height:var(--s);flex:none;--tk:#2fb877;--tk-2:#1f9a5f}
:root[data-theme="dark"] .tick{--tk:#4fd494;--tk-2:#2fae70}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tick{--tk:#4fd494;--tk-2:#2fae70}}
.tick svg{overflow:visible;display:block}
.tick .tk-w{stroke:var(--tk-2);stroke-width:2.4;stroke-linecap:round;fill:none}
.tick .tk-bd{fill:var(--tk);transition:fill .3s}
.tick .tk-sh{fill:#fff;opacity:.32}
.tick .tk-e ellipse{fill:#06140c}
.tick .tk-e circle{fill:#fff}
.tick .tk-m{fill:none;stroke:#06140c;stroke-width:1.5;stroke-linecap:round;opacity:0;transition:opacity .2s}
.tick .tk-b,.tick .tk-e{transform-box:fill-box;transform-origin:center}
.tick .tk-look{transform:translate(var(--lx,0px),var(--ly,0px));transition:transform .05s linear}
.tick .tk-lean{transform-box:view-box;transform-origin:16px 30px;transform:rotate(var(--lean,0deg));transition:transform .14s ease-out}
.tick.tk-think .tk-look{transform:none}
.tick.tk-idle .tk-e{animation:tkblink 5.5s infinite}
.tick.tk-think .tk-b{animation:tkstretch 1.1s ease-in-out infinite;transform-origin:center bottom}
.tick.tk-think .tk-e{animation:tkread 1.6s ease-in-out infinite}
.tick.tk-done{animation:tkhop .55s cubic-bezier(.3,1.6,.5,1)}
.tick.tk-done .tk-m,.tick.tk-happy .tk-m{opacity:1}
.tick.tk-err .tk-bd{fill:var(--down)}
.perch .tick{filter:drop-shadow(0 3px 5px rgba(0,0,0,.16))}
.perch .tick.tk-idle{animation:tkbob 4s ease-in-out infinite}
@keyframes tkblink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}
@keyframes tkstretch{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.1)}}
@keyframes tkread{0%,100%{transform:translateX(-1.2px)}50%{transform:translateX(1.2px)}}
@keyframes tkhop{40%{transform:translateY(-6px)}}
@keyframes tkbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}
@media (prefers-reduced-motion:reduce){.tick *,.tick{animation:none!important}.tick .tk-lean{transform:none}}
.askbtn .tick{margin:-2px 0}
.askbtn.ping{position:relative}
.askbtn.ping::after{content:"";position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;background:var(--up);box-shadow:0 0 0 2px var(--panel)}
body.tick-docked #askOpen{display:none}
/* the floating Tick (desktop); phones keep the header button */
.tfloat{position:fixed;right:var(--tf-r,24px);bottom:var(--tf-b,24px);z-index:36;height:44px;display:flex;align-items:center;gap:5px;padding:0 12px 0 7px;
  border:1px solid var(--rule);background:var(--panel);border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.14),0 1px 3px rgba(0,0,0,.08);
  font:600 13.5px/1 var(--f-body);color:var(--ink);cursor:pointer;touch-action:none;white-space:nowrap;
  transition:opacity .22s,transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .2s,border-color .2s}
.tfloat .tick{margin:-16px 0 0;filter:drop-shadow(0 4px 6px rgba(0,0,0,.16));transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.tfloat .tick.tk-idle{animation:tkbob 4s ease-in-out infinite}
.tfloat kbd{font-size:10.5px;color:var(--ink-3)}
.tfloat:hover{transform:translateY(-2px);box-shadow:0 14px 36px rgba(0,0,0,.18),0 1px 3px rgba(0,0,0,.08);border-color:color-mix(in srgb,var(--up) 45%,var(--rule))}
.tfloat:hover .tick{transform:translateY(-3px) rotate(-3deg)}
.tfloat:active{transform:translateY(0) scale(.98)}
.tfloat.dragging{cursor:grabbing;transform:scale(1.03);transition:opacity .22s,box-shadow .2s}
.tfloat.dragging .tick{transform:translateY(-5px) rotate(-6deg)}
.tf-say{position:absolute;right:0;bottom:calc(100% + 10px);font:600 12px/1 var(--f-body);color:var(--bg);background:var(--ink);padding:7px 10px;border-radius:9px 9px 3px 9px;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.16);opacity:0;transform:translateY(4px) scale(.96);transform-origin:right bottom;transition:opacity .18s,transform .22s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.tfloat.tf-l .tf-say{right:auto;left:0;border-radius:9px 9px 9px 3px;transform-origin:left bottom}
.tfloat.ping .tf-say{opacity:1;transform:none}
.tfloat.dragging .tf-say{opacity:0}
.tfloat.ping::after{content:"";position:absolute;top:-2px;right:-2px;width:10px;height:10px;border-radius:50%;background:var(--up);box-shadow:0 0 0 2px var(--bg)}
body.asking .tfloat{opacity:0;transform:scale(.6) translateY(10px);pointer-events:none}
@media (min-width:761px){#askOpen{display:none}}
/* Settings: one sheet, grouped cards, like the Mac's own settings */
dialog.sets{width:min(680px,calc(100vw - 32px));max-height:min(780px,calc(100dvh - 48px));padding:0;border:1px solid var(--rule);border-radius:18px;background:var(--bg);color:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.28),0 2px 8px rgba(0,0,0,.1);overflow:hidden}
dialog.sets[open]{display:flex;flex-direction:column;animation:rise .2s cubic-bezier(.2,.8,.2,1) both}
dialog.sets::backdrop{background:rgba(10,14,12,.38);backdrop-filter:blur(2px)}
.shead{display:grid;grid-template-columns:1fr auto;align-items:center;padding:16px 18px 0;border-bottom:1px solid var(--rule)}
.shead h2{margin:0;font:700 19px/1.2 var(--f-body);letter-spacing:-.015em}
.snav{grid-column:1/-1;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:10px -6px 0;padding-bottom:10px}
.snav a{flex:none;padding:6px 10px;border-radius:8px;font:500 13px var(--f-body);color:var(--ink-2);text-decoration:none}
.snav a:hover{background:var(--grid);color:var(--ink)}
.sbody{flex:1;overflow:auto;padding:4px 18px 24px;scroll-padding-top:8px;font-variant-numeric:normal}
.ssec h3{margin:20px 4px 8px;font:600 12.5px var(--f-body);color:var(--ink-3)}
.scard{background:var(--panel);border:1px solid var(--rule);border-radius:14px}
.srow{display:flex;align-items:center;gap:18px;padding:13px 16px;border-top:1px solid var(--grid)}
.scard>.srow:first-child{border-top:0}
.srow .sl{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.srow .sl b{font:600 13.5px/1.3 var(--f-body)}
.srow .sl small{font-size:12.5px;line-height:1.45;color:var(--ink-3)}
.srow .sl small a{color:var(--accent)}
.srow .sc{flex:none;display:flex;gap:8px;align-items:center}
.srow.col{flex-direction:column;align-items:stretch;gap:4px}
.srow.col .sc{flex:auto}
.cnprev{border-top:0;padding-top:0}.cnprev small{font-size:12px;color:var(--ink-3)}
.cn{background:var(--bg);border:1px solid var(--grid);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.cn b{font:600 13.5px/1.35 var(--f-body)}.cn p{margin:0;font-size:13px;line-height:1.5;color:var(--ink-2);white-space:pre-line}
.srow .lnk{padding:0;font-size:12.5px}
.srow select{height:32px;max-width:260px;border:1px solid var(--rule);border-radius:9px;background:var(--bg);color:var(--ink);font:500 13px var(--f-body);padding:0 8px}
.srow.frm{flex-wrap:wrap;gap:8px;border-top:0;padding-top:0}
.srow.frm input{flex:1 1 220px;min-width:0;height:30px;border:1px solid var(--rule);border-radius:8px;background:var(--bg);color:var(--ink);padding:0 10px;font-size:12.5px}
.sv{font-size:13px;color:var(--ink-2)}
.on-pill{font:600 11.5px/1 var(--f-body);color:var(--up);background:color-mix(in srgb,var(--up) 14%,transparent);padding:5px 9px;border-radius:999px}
.sags{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.sag{display:flex;align-items:center;gap:11px;padding:10px 12px;border:1px solid var(--rule);border-radius:12px;background:var(--bg);color:var(--ink);text-align:left;cursor:pointer;font:inherit;transition:border-color .15s,background .15s}
.sag:hover{border-color:color-mix(in srgb,var(--ink) 25%,var(--rule))}
.sag>span{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.sag b{font:600 13px var(--f-body)}
.sag small{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sag.on{border-color:color-mix(in srgb,var(--up) 60%,var(--rule));background:color-mix(in srgb,var(--up) 9%,var(--panel))}
.sag .ic{color:var(--up);flex:none}
.sag em{font:600 12px var(--f-body);color:var(--accent);font-style:normal;flex:none}
.tgl{position:relative;display:inline-block;width:38px;height:22px;flex:none}
.tgl input{position:absolute;inset:0;margin:0;opacity:0;cursor:pointer;z-index:1}
.tgl i{position:absolute;inset:0;border-radius:999px;background:var(--rule);transition:background .18s}
.tgl i::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .18s cubic-bezier(.2,.8,.2,1)}
.tgl input:checked+i{background:var(--up)}
.tgl input:checked+i::after{transform:translateX(16px)}
.tgl input:focus-visible+i{outline:2px solid color-mix(in srgb,var(--ink) 30%,transparent);outline-offset:2px}
dl.keys{display:grid;grid-template-columns:auto 1fr;gap:9px 14px;margin:6px 0 2px;align-items:center}
dl.keys dt{display:flex;gap:3px}dl.keys dd{margin:0;font-size:13px;color:var(--ink-2)}
.sets .pairl{margin:8px 0 0}
body.no-tfloat .tfloat{display:none}
.sets .drow .sl b{display:flex;align-items:center;gap:8px;font-weight:550}
.sets .drow .sv{font-variant-numeric:tabular-nums;text-align:right}
.sets .hdot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--up)}
.sets .hdot.bad{background:var(--warn,#d99a2b)}
.sets .dprob small{display:block;margin-top:4px}
.sets .dprob b{color:var(--warn,#b7791f)}
#gear.warn{position:relative}
#gear.warn::after{content:"";position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--warn,#d99a2b);box-shadow:0 0 0 2px var(--bg)}
@media (min-width:761px){body.no-tfloat:not(.tick-docked) #askOpen{display:inline-flex}}
/* import positions: reuses the Settings sheet */
dialog.imp{width:min(560px,calc(100vw - 32px))}
.imp .shead{padding-bottom:14px}.imp .shead>div{display:flex;flex-direction:column;gap:2px}
.isub{font-size:12.5px;color:var(--ink-3)}
.imsg{margin:16px 2px 12px;font-size:13.5px;line-height:1.5;color:var(--ink-2)}
.itbl{background:var(--panel);border:1px solid var(--rule);border-radius:12px;max-height:320px;overflow:auto}
.itbl table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.itbl th,.itbl td{padding:7px 12px;text-align:right;border-bottom:1px solid var(--grid);white-space:nowrap;font-size:13px}
.itbl th{font:600 10.5px/1.2 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);position:sticky;top:0;background:var(--panel)}
.itbl .l{text-align:left}.itbl td.tk{font:600 13px var(--f-mono)}.itbl tr:last-child td{border-bottom:0}
.imode{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:14px;font-size:13px;color:var(--ink-2)}
.inote{margin:12px 2px 0;font-size:12px}
.idone{display:flex;gap:10px;align-items:flex-start;margin:18px 2px 4px}.idone .ic{color:var(--up);flex:none;margin-top:1px}
.idone>div{display:flex;flex-direction:column;gap:4px}.idone b{font:600 14px var(--f-body)}.idone small{font-size:12.5px;color:var(--ink-3);line-height:1.45}
.ifoot{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:12px 18px;border-top:1px solid var(--rule)}
.ifoot .err{margin-right:auto}
/* linked accounts in Settings and the review sheet */
.lkrow .sl small.bad,.lkconf small.bad{color:var(--down)}
.lkic{flex:none;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--grid);color:var(--ink-3)}
.lkic.on{background:var(--accent-soft);color:var(--accent)}
.lkspin{display:inline-block;width:9px;height:9px;margin:0 7px -1px 0;border-radius:50%;border:1.5px solid var(--rule);border-top-color:var(--accent);animation:lkspin .8s linear infinite}
@keyframes lkspin{to{transform:rotate(360deg)}}
.lkconf{border-top:0;padding-top:0}
.lkadd{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.lkadd .sag>.ic:first-child{color:var(--ink-3)}.lkadd .sag>.ic:last-child{color:var(--ink-3);margin-left:auto}
.lkadd .sag>span{min-width:0;display:flex;flex-direction:column;gap:2px}
.btn.danger{background:var(--down);border-color:var(--down);color:#fff}
.lkaccts{display:flex;flex-direction:column;margin:0 0 12px;background:var(--panel);border:1px solid var(--rule);border-radius:12px}
.lkacc{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--grid);font-size:13px;cursor:pointer}
.lkacc:first-child{border-top:0}.lkacc input{flex:none;accent-color:var(--accent);width:15px;height:15px;margin:0}
.lkacc span{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}.lkacc small{font-size:11.5px;color:var(--ink-3)}
.lkacc em{font-style:normal;font-variant-numeric:tabular-nums;color:var(--ink-3);font-size:12.5px}
.itbl .lkn{display:block;font:500 11px var(--f-body);color:var(--ink-3)}
.lkdup{display:flex;gap:10px;align-items:flex-start;margin:12px 2px 0;font-size:13px;line-height:1.45;color:var(--ink-2);cursor:pointer}
.lkdup input{flex:none;accent-color:var(--accent);width:15px;height:15px;margin:2px 0 0}
@media (max-width:600px){
  .lkadd{grid-template-columns:minmax(0,1fr)}
  dialog.sets{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;border-radius:0;border:0}
  .srow{flex-wrap:wrap;gap:10px}.srow .sc{flex-basis:100%}.srow:has(.tgl) .sc{flex-basis:auto}
  .sags{grid-template-columns:1fr}
}

@media (max-width:760px){.tfloat{display:none}}
body.tick-docked .bar-in{flex-wrap:nowrap}
body.tick-docked .live #status{display:none}
/* with Tick docked the page can be narrow on a wide window, so the header follows the page's width, not the window's */
header.bar{container-type:inline-size}
@container (max-width:1120px){
  body.tick-docked .bar-in{flex-wrap:wrap}
  body.tick-docked .mainnav{order:10;flex:1 1 100%;overflow-x:auto;scrollbar-width:none;margin:0 -6px}
  body.tick-docked .mainnav::-webkit-scrollbar{display:none}
  body.tick-docked .brand{margin-right:auto}
  body.tick-docked #ts{width:300px}
  body.tick-docked .bar-in .live{margin-left:0}
}
body.tick-docked .live{margin-left:auto}
@media (max-width:1500px){body.tick-docked .mainnav a{padding-inline:9px}}
/* page icons in the header: room is tight below ~1560 px of header, so the search narrows first, and below 1320 px the icons step aside (they come back when the nav gets its own row) */
@container (min-width:861px) and (max-width:1560px){#ts{width:256px}.mainnav a{padding-inline:8px;gap:6px}}
@container (min-width:861px) and (max-width:1430px){body:not(.tick-docked) .mainnav a .ic{display:none}#ts{width:220px}}
@container (min-width:1121px) and (max-width:1300px){body.tick-docked .mainnav a .ic{display:none}}
.askbtn{gap:5px}

/* a new conversation: Tick speaks first */
.tk-hi{animation:rise .3s cubic-bezier(.2,.8,.2,1) both}
.tk-greet{font:650 17px/1.4 var(--f-body);letter-spacing:-.012em;color:var(--ink);margin:2px 0 4px;text-wrap:balance}
.tk-sub{color:var(--ink-3);font-size:13px;line-height:1.5;margin:0 0 16px;text-wrap:pretty}
.notes{display:grid;gap:6px;margin:0 0 22px}
.nt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;align-items:start;text-align:left;border:1px solid transparent;background:var(--tk-fill);border-radius:14px;padding:11px 12px;cursor:pointer;color:var(--ink);font:400 13.5px/1.45 var(--f-body);transition:border-color .15s,background .15s}
.nt:hover{border-color:var(--tk-line);background:var(--panel)}
.nt i{width:7px;height:7px;border-radius:50%;background:var(--ink-3);margin-top:6px}
.nt i.up{background:var(--up)}.nt i.down{background:var(--down)}.nt i.ev{background:var(--warn)}
.nt b{font-weight:650}.nt b.up{color:var(--up)}.nt b.down{color:var(--down)}
.nt em{grid-column:2;font-style:normal;font:500 12.5px var(--f-body);color:var(--ink-3);display:inline-flex;align-items:center;gap:2px;transition:color .15s}
.nt:hover em{color:var(--ink)}
.tk-lab{font:600 12px var(--f-body);color:var(--ink-3);margin:0 0 8px}
.pbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.pb.pball{border-style:dashed;color:var(--ink-2);gap:4px;padding-right:9px}.pb.pball:hover{color:var(--ink)}
.pb{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--tk-line);background:var(--panel);border-radius:999px;padding:7px 12px;font:500 13px var(--f-body);color:var(--ink);cursor:pointer;transition:border-color .15s,background .15s,transform .15s}
.pb:hover{border-color:color-mix(in srgb,var(--ink) 24%,transparent);background:var(--tk-fill)}
.pb:active{transform:scale(.97)}
.pb .ic{color:var(--ink-3)}

/* the conversation */
.ctxsep{display:flex;align-items:center;gap:10px;margin:4px 0 16px;font:600 11px var(--f-body);color:var(--ink-3)}
.ctxsep::before,.ctxsep::after{content:"";flex:1;height:1px;background:var(--grid)}
.am{margin:0 0 22px}
.am.new{animation:rise .25s cubic-bezier(.2,.8,.2,1) both}
.am.u{display:flex;justify-content:flex-end}
.am.u p{margin:0;background:var(--tk-fill);border:1px solid var(--tk-line);border-radius:16px 16px 5px 16px;padding:9px 13px;max-width:86%;font-size:14px;line-height:1.5;text-wrap:pretty}
/* charts and files from Tick's workbench */
.tkimg{margin:12px 0;padding:0}
.tkimg img{display:block;width:100%;height:auto;border-radius:10px;border:1px solid var(--tk-line);background:var(--panel)}
.tkimg figcaption{font-size:12px;color:var(--ink-3);margin-top:6px}
.tkimg.bad{display:none}
.tkfiles{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 10px}
.tkfiles .tkimg{flex:1 1 100%;margin:4px 0}
.tkfile{display:inline-flex;align-items:center;gap:7px;max-width:100%;padding:7px 11px;border:1px solid var(--tk-line);border-radius:10px;
  font-size:13px;color:var(--ink);text-decoration:none;background:var(--panel)}
.tkfile:hover{border-color:var(--ink-3)}
.tkfile span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tkfile em{font-style:normal;color:var(--ink-3);font-size:12px;font-variant-numeric:tabular-nums}
.tkfile .ic{color:var(--ink-3);flex:none}
/* the work log, HyperFrames-style: the agent's notes in order, tool calls grouped into chips that open */
.tr{margin:0 0 14px}
.tr>summary,.trg>summary,.trs>summary{list-style:none}
.tr>summary::-webkit-details-marker,.trg>summary::-webkit-details-marker,.trs>summary::-webkit-details-marker{display:none}
.tr>summary,.trh{display:inline-flex;align-items:center;gap:6px;padding:2px 0;font-size:13px;color:var(--ink-2)}
.tr>summary{cursor:pointer}
.tr>summary:hover{color:var(--ink)}
.tr>summary b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.tr>summary .hn{color:var(--ink-3)}
.tr>summary .hn::before{content:"· "}
.tr>summary>.ic,.trg>summary>.ic:last-child,.trs>summary>.ic:last-child{color:var(--ink-3);flex:none;transition:transform .2s}
.tr[open]>summary>.ic,.trg[open]>summary>.ic:last-child,.trs[open]>summary>.ic:last-child{transform:rotate(90deg)}
.trh{color:var(--ink)}
.trh .spin,.trs.now .sb::before{content:"";width:12px;height:12px;flex:none;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 30%,#2fb877);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 1.5px));mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 1.5px));animation:spin .9s linear infinite}
.trh .sl,.trs.now .sl{background:linear-gradient(90deg,var(--ink) 0 38%,var(--ink-3) 50%,var(--ink) 62% 100%);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:tkshine 2.2s linear infinite}
.trh .el,.trs .el{font:500 12px var(--f-body);font-style:normal;color:var(--ink-3);font-variant-numeric:tabular-nums}
.trb{display:grid;gap:9px;margin:9px 0 0 6px;padding:2px 0 2px 16px;border-left:1px solid var(--tk-line)}
.trn{font-size:13.5px;line-height:1.55;color:var(--ink-2);text-wrap:pretty}
.trn p{margin:0}
.trn p+p,.trn ul,.trn ol{margin-top:6px}
.trn ul,.trn ol{margin-bottom:0;padding-left:18px}
.trg{justify-self:start;max-width:100%}
.trg>summary{display:inline-flex;align-items:center;gap:7px;max-width:100%;padding:4px 10px 4px 9px;border:1px solid var(--tk-line);border-radius:999px;
  background:var(--panel);font-size:12.5px;color:var(--ink-2);cursor:pointer;transition:border-color .15s,color .15s}
.trg>summary:hover{color:var(--ink);border-color:var(--ink-3)}
.trg>summary .ic:first-child{color:var(--ink-3);flex:none}
.trg>summary span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trgl{display:grid;gap:7px;margin:9px 0 2px 2px}
.trs{font-size:13px;color:var(--ink-2);min-width:0}
.trs>summary,div.trs{display:flex;align-items:center;gap:9px;min-width:0}
.trs>summary{cursor:pointer}
.trs>summary:hover{color:var(--ink)}
.trs .sb{width:24px;height:22px;flex:none;border:1px solid var(--tk-line);border-radius:7px;display:grid;place-items:center;color:var(--ink-3);background:var(--panel)}
.trs .sl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.trs .el{margin-left:auto;padding-left:8px}
.trs>summary .el+.ic{margin-left:6px}
.trs>summary .sl+.ic{margin-left:auto}
.trs.now{color:var(--ink)}
.trs.now .sb{border-color:color-mix(in srgb,#2fb877 45%,var(--tk-line))}
.trd{margin:7px 0 3px 33px;min-width:0}
.trd pre{margin:0;padding:9px 11px;max-height:280px;overflow:auto;border-radius:9px;background:var(--grid);font:500 11.5px/1.55 var(--f-code);
  color:var(--ink);white-space:pre-wrap;word-break:break-word}
.trd a{font-size:12.5px;word-break:break-all}
.trd pre+pre{margin-top:6px}
.trd pre.trx{background:color-mix(in srgb,var(--down) 9%,transparent);color:var(--ink-2)}
.trs.bad .sb{color:var(--down);border-color:color-mix(in srgb,var(--down) 40%,var(--tk-line))}
.trn.th{font-size:13px;font-style:italic;color:var(--ink-3)}
.trhide{justify-self:start;margin-top:2px;padding:3px 0;border:0;background:none;font:inherit;font-size:12.5px;color:var(--ink-3);cursor:pointer}
.trhide:hover{color:var(--ink)}
.trn.fresh,.trg.fresh,.trs.fresh{animation:stpin .38s cubic-bezier(.2,.8,.2,1) both}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes tkshine{from{background-position:100% 0}to{background-position:-60% 0}}
@keyframes stpin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.trn.fresh,.trg.fresh,.trs.fresh{animation:none}.trh .sl,.trs.now .sl{animation:none;color:var(--ink);background:none}}

/* conversations */
.hist-h{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px}
.hist h3{font:650 15px var(--f-body);margin:0}
.hist ul{list-style:none;margin:0 -8px;padding:0}
.hist li{display:flex;align-items:center;border-radius:12px;transition:opacity .18s,transform .18s,background .15s}
.hist li.gone{opacity:0;transform:translateX(12px)}
.hist li.on{background:var(--tk-fill)}
.hist li:hover{background:var(--tk-fill)}
.hist-o{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;text-align:left;border:0;background:none;padding:10px 12px;cursor:pointer;color:var(--ink)}
.hist-o b{font-weight:550;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist-o small{font-size:12px;color:var(--ink-3)}
.hist .x{width:30px;height:30px;border:0;background:none;border-radius:8px;color:var(--ink-3);cursor:pointer;opacity:0;margin-right:6px;display:grid;place-items:center}
.hist li:hover .x{opacity:1}.hist .x:hover{color:var(--down)}
.hist .hint{margin:0}
.ask-agents h3{font:650 17px/1.35 var(--f-body);letter-spacing:-.012em;margin:4px 0 6px;text-wrap:balance}
.ask-agents>p{color:var(--ink-2);margin:0 0 16px;line-height:1.55;text-wrap:pretty}
.md{font:400 14px/1.62 var(--f-body);color:var(--ink);text-wrap:pretty}
.md p{margin:0 0 10px}
.md ul,.md ol{margin:0 0 10px;padding-left:20px}
.md li{margin:4px 0}
.md li::marker{color:var(--ink-3)}
.md h4{font:650 14px var(--f-body);margin:16px 0 6px}
.md b{font-weight:650}
.md a{color:var(--accent)}
.md hr{border:0;border-top:1px solid var(--grid);margin:12px 0}
.md code{font:500 12.5px var(--f-code);background:var(--grid);padding:1px 4px;border-radius:4px}
.md .mdpre{margin:0 0 10px;padding:10px 12px;background:var(--grid);border-radius:10px;overflow:auto;font:500 12px/1.5 var(--f-code)}
.md .mdpre code{background:none;padding:0}
/* Tick's charts */
:root{--c4:#8d63d2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--c4:#b894f2}}
:root[data-theme="dark"]{--c4:#b894f2}
.md figure.tkc{margin:4px 0 14px;padding:12px 12px 8px;border:1px solid var(--rule);border-radius:12px;background:var(--panel);position:relative}
.md figure.tkc figcaption{font:600 12.5px var(--f-body);color:var(--ink);margin:0 0 8px}
.md figure.tkc.wait{display:grid;place-items:center;height:120px;color:var(--ink-3);font-size:12.5px;background:linear-gradient(90deg,var(--panel),var(--grid),var(--panel));background-size:200% 100%;animation:shimmer 1.4s linear infinite}
@keyframes shimmer{to{background-position:-200% 0}}
.ch-box{position:relative}
.ch-box svg{display:block;width:100%;height:auto;overflow:visible;font-variant-numeric:tabular-nums}
.ch-g{stroke:var(--grid)}.ch-0{stroke:var(--ink-3);stroke-dasharray:3 3;opacity:.6}
.ch-a{font:500 10.5px var(--f-body);fill:var(--ink-3)}
.ch-l{font:600 11.5px var(--f-body);fill:var(--ink)}
.ch-v{font:500 11px var(--f-body);fill:var(--ink-2)}
.ch-e{font:600 11px var(--f-body)}
.ch-x{stroke:var(--ink-3);stroke-width:1;opacity:.6}
.ch-leg{display:flex;gap:12px;margin:0 0 6px;font-size:12px;color:var(--ink-2)}
.ch-leg span,.ch-tip span{display:inline-flex;align-items:center;gap:5px}
.ch-leg i,.ch-tip i{width:8px;height:8px;border-radius:2px;display:inline-block}
.ch-tip{position:absolute;top:-6px;transform:translateY(-100%);background:var(--panel);color:var(--ink);border:1px solid var(--rule);border-radius:8px;padding:6px 8px;font:500 11.5px/1.35 var(--f-body);display:flex;flex-direction:column;gap:2px;pointer-events:none;white-space:nowrap;z-index:2;font-variant-numeric:tabular-nums;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.ch-tip[hidden]{display:none}
.ch-tip em{font-style:normal;font-weight:650}
.mdt{overflow-x:auto;margin:4px 0 12px}
.md table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.md th,.md td{padding:5px 12px 5px 0;border-bottom:1px solid var(--grid);text-align:left;white-space:nowrap}
.md th{font-weight:600;color:var(--ink-3);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.tkl{display:inline;border:0;background:none;padding:0;font:inherit;font-weight:inherit;color:inherit;cursor:pointer;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--ink) 30%,transparent);text-underline-offset:3px;text-decoration-thickness:1px}
.tkl:hover{text-decoration-color:currentColor}
.caret{display:inline-block;width:7px;height:15px;background:#2fb877;vertical-align:-2px;margin-left:2px;border-radius:2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.af{display:flex;align-items:center;gap:2px;margin-top:2px;font-size:12px;color:var(--ink-3)}
.af .ib{width:28px;height:28px;border:0;background:none;border-radius:8px;color:var(--ink-3);cursor:pointer;display:grid;place-items:center;transition:background .15s,color .15s}
.af .ib:hover{background:var(--tk-fill);color:var(--ink)}
.af span{margin-left:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.af span b{font-weight:600;color:var(--ink-2)}
.aerr{color:var(--down);font-size:13px;margin-top:6px;line-height:1.45}
.agl{list-style:none;margin:0 0 14px;padding:0;border-top:1px solid var(--grid)}
.agl li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--grid)}
.agl b{display:block;font-weight:600;font-size:14px}
.agl small{color:var(--ink-3);font-size:12.5px}
.st{font:600 11.5px var(--f-body);color:var(--ink-3);white-space:nowrap}
.st.ok{color:var(--up)}.st.warn{color:var(--warn)}
.agl .btn{min-width:72px;justify-content:center}
.agcmd,.pairbox{background:var(--raise);border:1px solid var(--rule);border-radius:12px;padding:12px;margin:0 0 12px;font-size:13px;color:var(--ink-2);line-height:1.5}
.agcmd p,.pairbox p{margin:0}
.agwait{display:flex;align-items:center;gap:8px;color:var(--ink-3);font-size:12.5px}
.agwait i{flex:none;width:7px;height:7px;border-radius:50%;background:var(--warn);animation:agw 1.6s ease-in-out infinite}
.agwait .lnk{margin-left:auto;padding:0}
@keyframes agw{50%{opacity:.25}}
.pairl{display:flex;gap:8px;align-items:center;margin:9px 0}
.pairqr{display:flex;gap:16px;align-items:center;margin:4px 0 6px}
.pairqr[hidden]{display:none}
.pairqr svg{flex:none;width:168px;height:168px;border-radius:12px;box-shadow:0 0 0 1px var(--rule)}
.pairqr p{margin:0;font-size:13px;line-height:1.5;color:var(--ink-2);max-width:30ch}
.pairl code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:500 12px var(--f-code);background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:6px 8px;color:var(--ink)}
.askrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:14px 0 4px}
.askl{display:inline-flex;align-items:center;gap:5px;font:600 12px var(--f-body);color:var(--ink-3);margin-right:2px}

    const F=facts(h.t)||{rets:{}}; const {r,late}=ret(base.px[h.t],i0);
    const ex={}; HZ.forEach(k=>ex[k]=F.rets[k]!=null&&ff.rets[k]!=null?F.rets[k]-ff.rets[k]:null);   // plain difference, so +23.3% vs −2.0% reads +25.3
    return {...F,t:h.t,n:h.n,w:h.w,r,late,ex,exh:ex[hz],sector:sectors[h.t]||"Unclassified"};
  });
  const sumW=rows.reduce((a,x)=>a+x.w,0);

  const sumC=rows.reduce((a,x)=>a+x.c,0), Rpp=R==null?null:R*100;
  if(!f.complete&&Rpp!=null) rows.push({t:"Other",n:"Rest of fund (not itemised)",w:100-sumW,w0:100-sumW,r:null,c:Rpp-sumC,exh:null,ex:{},rets:{},sector:"Other",other:true});
  rows.forEach(x=>x.share=Rpp?x.c/Rpp:null);
  const ranked=rows.filter(r=>!r.other&&r.r!=null).sort((a,b)=>a.r-b.r);
  ranked.forEach((r,i)=>r.rs=Math.round(1+98*i/Math.max(1,ranked.length-1)));
  const items=rows.filter(r=>!r.other&&r.r!=null);
  const ew=items.length?items.reduce((a,r)=>a+r.r,0)/items.length:null;
  const withTrend=items.filter(r=>r.vs50!=null), with200=items.filter(r=>r.vs200!=null);
  const st={

    beat:items.filter(r=>r.exh>0), ew,

    above200:with200.filter(r=>r.vs200>0).length/Math.max(1,with200.length),
    nearHi:items.filter(r=>r.offHi!=null&&r.offHi>-0.02).length,
    nearLo:items.filter(r=>r.lo&&r.last<=r.lo*1.02).length,
  };
  st.beatW=st.beat.reduce((a,r)=>a+r.w,0)/sumW;
  const sign=Math.sign(Rpp||0)||1;
  st.drivers=[...items].sort((a,b)=>sign*(b.c-a.c)).slice(0,5);
  st.top5=st.drivers.reduce((a,r)=>a+r.c,0);
  st.top10w=[...items].sort((a,b)=>b.w-a.w).slice(0,10).reduce((a,r)=>a+r.w,0);
  return {f,R,Rpp,ff,rows,items,sumC,sumW,i0,st};
}

/* fund-level stats for the pulse strip (all four funds, current horizon) */
function computePulse(){
  const out={};
  FUND_ORDER.forEach(k=>{
    const f=base.funds[k]; if(!f) return;
    const i0=idx(hz), r=ret(base.px[k],i0).r;
    const rs=f.holdings.map(h=>ret(base.px[h.t],i0).r).filter(v=>v!=null);
    const ew=rs.length?rs.reduce((a,b)=>a+b,0)/rs.length:null;
    out[k]={r,ew,up:rs.filter(v=>v>0).length,n:rs.length,spark:series(base.px[k],i0)};
  });
  return out;
}
function series(a,i0,maxPts=80){ if(!a) return []; const s=firstValid(a,i0); if(!s) return []; const pts=[]; for(let k=s.k;k<a.length;k++) if(a[k]!=null) pts.push([k,a[k]/s.v-1]); if(pts.length<=maxPts) return pts; const step=pts.length/maxPts, out=[]; for(let j=0;j<maxPts;j++) out.push(pts[Math.floor(j*step)]); out.push(pts[pts.length-1]); return out; }

function spark(pts,w=240,h=38,color){
  if(pts.length<2) return `<svg viewBox="0 0 ${w} ${h}"></svg>`;
  const ys=pts.map(p=>p[1]), lo=Math.min(0,...ys), hi=Math.max(0,...ys), pad=(hi-lo)*.1||.001;
  const k0=pts[0][0], k1=pts[pts.length-1][0];
  const X=k=>2+(w-6)*(k-k0)/Math.max(1,k1-k0), Y=v=>2+(h-4)*(1-(v-lo+pad)/(hi-lo+2*pad));
  const d=pts.map((p,j)=>(j?"L":"M")+X(p[0]).toFixed(1)+","+Y(p[1]).toFixed(1)).join("");
  const end=pts[pts.length-1];
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><line x1="0" x2="${w}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--rule)" stroke-dasharray="2 3"/><path d="${d}L${X(end[0])},${Y(0)}L${X(k0)},${Y(0)}Z" fill="${color}" opacity=".1"/><path d="${d}" fill="none" stroke="${color}" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>`;
}

/* ======================= market map (squarified treemap) ======================= */
function squarify(nodes,x,y,w,h){
  const out=[], total=nodes.reduce((a,n)=>a+n.v,0); if(total<=0||w<=0||h<=0) return out;
  const sc=w*h/total; let rest=nodes.map(n=>({n,a:n.v*sc}));
  while(rest.length){
    const sh=Math.min(w,h); const worst=r=>{const s=r.reduce((a,q)=>a+q.a,0),mx=Math.max(...r.map(q=>q.a)),mn=Math.min(...r.map(q=>q.a));return Math.max(sh*sh*mx/(s*s),s*s/(sh*sh*mn));};
    let row=[rest[0]],i=1; while(i<rest.length&&worst([...row,rest[i]])<=worst(row)){row.push(rest[i]);i++;}
    const s=row.reduce((a,q)=>a+q.a,0);
    if(w>=h){const cw=s/h;let cy=y;row.forEach(q=>{const ch=q.a/cw;out.push({n:q.n,x,y:cy,w:cw,h:ch});cy+=ch;});x+=cw;w-=cw;}
    else{const rh=s/w;let cx=x;row.forEach(q=>{const cw=q.a/rh;out.push({n:q.n,x:cx,y,w:cw,h:rh});cx+=cw;});y+=rh;h-=rh;}
    rest=rest.slice(i);
  }
  return out;
}

}

/* ======================= rotation quadrant ======================= */
/* axis labels with just enough decimals that every gap reads the same (2.5% steps show as 2.5, 5.0, 7.5) */
function tickPct(t,a){ const st=a.length>1?Math.abs(a[1]-a[0])*100:1; let d=0; while(d<2&&Math.abs(st*10**d-Math.round(st*10**d))>1e-6) d++; return pct(t,d); }
function niceTicks(lo,hi,n){ const span=hi-lo; if(!(span>0)||!isFinite(span)) return isFinite(lo)?[lo]:[];   // a flat or empty series would otherwise loop forever
  const step0=span/n,mag=Math.pow(10,Math.floor(Math.log10(step0))); const step=[1,2,2.5,5,10].map(x=>x*mag).find(x=>span/x<=n)||mag*10; const out=[]; for(let v=Math.ceil(lo/step)*step;v<=hi+1e-12;v+=step) out.push(Math.abs(v)<1e-12?0:v); return out; }
/* Relative Rotation Graph, the chart traders use for relative strength (Julius de Kempenaer's RRG, as on StockCharts).
   RS = stock ÷ fund. RS-Ratio is RS normalised against its own recent average (100 = keeping pace with the fund);
   RS-Momentum is the same normalisation applied to RS-Ratio's rate of change (100 = strength steady).
   The exact JdK formulas are unpublished; this is the widely used open approximation (rolling z-scores around 100).
   The selected range sets the bar size and the tail: short ranges use daily bars, longer ones weekly, and the tail
   traces where each stock has been over that range. */
const RRG={"1D":{step:1,tail:1},"1W":{step:1,tail:5},"1M":{step:5,tail:4},"3M":{step:5,tail:13},"6M":{step:5,tail:26},"1Y":{step:5,tail:52}};
const RRG_WIN=10;
function rrgCfg(h){ if(h!=="YTD") return RRG[h]||RRG["3M"];
  const d=(Date.now()-new Date(new Date().getFullYear(),0,1))/864e5; return d<45?{step:1,tail:Math.max(1,Math.round(d*5/7))}:{step:5,tail:Math.round(d/7)}; }
function rrgPath(a,b,step,tail){
  // computed on daily closes with the windows scaled to the bar size, then sampled, so tails curve instead of jumping

  const ema=arr=>{ const al=2/(sm+1); let e=null; return arr.map(v=>v==null?(e=null):(e=e==null?v:e+al*(v-e))); };
  const z=(arr,i)=>{ if(i<win-1) return null; let m=0,c=0; for(let j=i-win+1;j<=i;j++){ if(arr[j]==null) return null; m+=arr[j]; c++; } m/=c;
    let v=0; for(let j=i-win+1;j<=i;j++) v+=(arr[j]-m)**2; const sd=Math.sqrt(v/c); return sd>0?(arr[i]-m)/sd:0; };

  const roc=ema(rsr.map((v,i)=>i>=step&&v!=null&&rsr[i-step]!=null?v-rsr[i-step]:null));
  const rsm=roc.map((_,i)=>{ const v=z(roc,i); return v==null?null:100+v; });

    s+=`<g data-sel="${esc(r.t)}" data-tip="${esc(`<b>${r.t}</b> · ${r.n}<br><b>${QN[c]}</b> · strength ${h[0].toFixed(1)}, momentum ${h[1].toFixed(1)}<br>${tailN===1?"A day":tailWords[0].toUpperCase()+tailWords.slice(1)} ago: ${QN[quadColor(was)].toLowerCase()}${r.ex[hz]!=null?`<br>${hz==="YTD"?"Year to date":hz}: ${pct(r.ex[hz])} vs ${esc(vs)}`:""}<br>Weight ${r.w.toFixed(2)}%`)}">${tail}<circle class="hd" cx="${X(h[0]).toFixed(1)}" cy="${Y(h[1]).toFixed(1)}" r="${rad(r.w).toFixed(1)}" fill="${c}" fill-opacity="${on?.95:.6}" stroke="${on?"var(--ink)":"var(--panel)"}" stroke-width="${on?2:1.2}"/></g>`; });
  // labels: biggest names first, each where it overlaps no dot, label or quadrant name; skipped if nowhere fits
  const dots=pts.map(r=>{ const k=rad(r.w)+1, h=head(r); return {t:r.t,b:[X(h[0])-k,Y(h[1])-k,2*k,2*k]}; });
  const over=(b,o)=>b[0]<o[0]+o[2]&&b[0]+b[2]>o[0]&&b[1]<o[1]+o[3]&&b[1]+b[3]>o[1];
  const qBox=(l,a,tx,ty)=>{ const w=l.length*fs*.78; return [a==="end"?tx-w:tx,ty-fs,w,fs+3]; };
  q.forEach(e=>{ const [,,,,,l,a,tx,ty]=e; if(!dots.some(d=>over(qBox(l,a,tx,ty),d.b))) return;
    const na=a==="end"?"start":"end", ntx=a==="end"?X(100)+6:X(100)-6; if(!dots.some(d=>over(qBox(l,na,ntx,ty),d.b))){ e[6]=na; e[7]=ntx; } });
  const boxes=q.map(([,,,,,l,a,tx,ty])=>qBox(l,a,tx,ty));
  const hit=(b,t)=>boxes.some(o=>over(b,o))||dots.some(d=>d.t!==t&&over(b,d.b))||b[0]<L||b[0]+b[2]>W-R||b[1]<T||b[1]+b[3]>H-B2;
  const order=[...pts.slice(0,14)]; if(sel&&!order.some(r=>r.t===sel)){ const r=pts.find(p=>p.t===sel); if(r) order.unshift(r); }
  let labs=""; const lh=fs+3;
  order.forEach(r=>{ const h=head(r), cx=X(h[0]), cy=Y(h[1]), rr=rad(r.w), w=r.t.length*fs*.72+4;
    const opts=[[cx+rr+3,cy-lh/2],[cx-rr-3-w,cy-lh/2],[cx-w/2,cy-rr-lh-2],[cx-w/2,cy+rr+2],[cx+rr*.7+2,cy-rr*.7-lh+2],[cx-rr*.7-2-w,cy-rr*.7-lh+2],[cx+rr*.7+2,cy+rr*.7-2],[cx-rr*.7-2-w,cy+rr*.7-2]];
    const ok=opts.find(([x,y])=>!hit([x,y,w,lh],r.t)); if(!ok&&r.t!==sel) return; const [x,y]=ok||opts[0];
    boxes.push([x,y,w,lh]); labs+=`<text x="${x.toFixed(1)}" y="${(y+fs).toFixed(1)}" font-size="${fs}" class="mono" font-weight="600" fill="var(--ink)" stroke="var(--panel)" stroke-width="3" paint-order="stroke" pointer-events="none">${esc(r.t)}</text>`; });
  q.forEach(([,,,,c,l,a,tx,ty])=>{ s+=`<text x="${tx}" y="${ty}" font-size="${fs}" font-weight="700" letter-spacing=".08em" text-anchor="${a}" fill="${c}" stroke="var(--panel)" stroke-width="3" paint-order="stroke" pointer-events="none">${l.toUpperCase()}</text>`; });
  box.innerHTML=s+labs+"</svg>";
}

function passes(r){
  if(query&&!(r.t.toLowerCase().includes(query)||r.n.toLowerCase().includes(query)||(r.sector||"").toLowerCase().includes(query))) return false;
  if(filter==="leaders") return r.exh>0; if(filter==="laggards") return r.exh!=null&&r.exh<0;
  if(filter==="highs") return r.offHi!=null&&r.offHi>-0.02; if(filter==="lows") return r.lo&&r.last<=r.lo*1.02;
  if(filter==="below200") return r.vs200!=null&&r.vs200<0; return true;
}

      <td>${r.pos==null?"–":`<span class="rng" title="Low ${money(r.lo)} · High ${money(r.hi)}"><i style="left:calc(${(r.pos*100).toFixed(0)}% - 1.5px)"></i></span><span class="num ${cls(r.offHi)}" style="font-size:12px">${pct(r.offHi,1)}</span>`}</td>

function chipBg(v){ if(v==null) return "transparent"; const p=Math.round(clamp(Math.abs(v)/HEAT[hz],0,1)*22)+4; return `color-mix(in oklab, ${v>=0?"var(--up)":"var(--down)"} ${p}%, transparent)`; }
function renderNote(){

  if(isPseudo(fund)){ $("#note").innerHTML=`How this is computed. ${fund==="Portfolio"?"Your portfolio is valued at live prices with the shares you entered. Its history assumes you held today's shares for the whole period, so it shows what drove your current holdings rather than your actual past trades.":"Your watchlist is treated as an equal-weight basket, rebalanced daily."} Contribution is start-of-period weight × return, as for the funds. Prices come from Yahoo Finance.`; return; }

async function loadDetail(t,force){
  const c=detailCache[t]; if(c&&!force&&(c.loading||Date.now()-c.at<10*60e3)) return c.loading?c.promise:undefined;
  let done; detailCache[t]={...(c||{}),loading:true,at:Date.now(),promise:new Promise(r=>done=r)};
  try{ const d=await (await fetch("/api/stock?t="+encodeURIComponent(t))).json(); detailCache[t]={...d,at:Date.now()}; }
  catch(e){ detailCache[t]={t,info:{},news:[],infoError:"Couldn't reach the local server.",at:Date.now()-9*60e3}; }
  done();
  if(drawerOpen&&sel===t) renderDetail();

  const d=detailCache[t]; if(c?.info&&Object.keys(c.info).length&&d.infoError){ d.info=c.info; delete d.infoError; }

  const p=ts.filter(x=>x&&x>back); return p.length?Math.max(...p):null; }

/* build the two personal "funds" from your data, with an index series so all the fund math works */
function buildPseudo(){
  if(!base) return;
  const n=base.dates.length, nm=t=>nameOf(t);
  const mk=(key,items,weightOf)=>{
    const live=items.filter(x=>base.px[x.t]&&lastValid(base.px[x.t])!=null);
    const vals=live.map(weightOf), tot=vals.reduce((a,b)=>a+b,0)||1;
    base.funds[key]={name:PSEUDO[key],asOf:"live prices",complete:true,pseudo:true,
      holdings:live.map((x,i)=>({t:x.t,n:nm(x.t),w:vals[i]/tot*100}))};
    // chain-linked index: each day's return is the weighted return of what was priced on both days
    const idx=new Array(n).fill(null); let lvl=null;
    for(let k=0;k<n;k++){
      let num=0,den=0;
      if(k>0) live.forEach((x,i)=>{ const a=base.px[x.t], p0=a[k-1], p1=a[k]; if(p0!=null&&p1!=null){ const sz=key==="Portfolio"?x.shares*p0:1; num+=sz*(p1/p0-1); den+=sz; } });
      const any=live.some(x=>base.px[x.t][k]!=null);
      if(lvl==null){ if(any) lvl=100; } else if(den>0) lvl*=1+num/den;
      idx[k]=lvl==null?null:+lvl.toFixed(6);
    }
    base.px[key]=idx;
  };
  mk("Watchlist",(me?.watch||[]).map(t=>({t})),()=>1);
  mk("Portfolio",positionsAgg(),x=>x.shares*lastValid(base.px[x.t]));
}
