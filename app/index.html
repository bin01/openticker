/* import positions from a broker's CSV (Fidelity, Schwab, Vanguard, E*TRADE, and most others).
   Everything is read here in the browser; only ticker, shares and cost per share go to the server. */
function csvTable(text){
  text=text.replace(/^﻿/,"");
  const first=text.split(/\r?\n/).slice(0,40).join("\n"), d=(first.match(/\t/g)||[]).length>(first.match(/,/g)||[]).length?"\t":(first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?";":",";
  const rows=[]; let row=[],f="",q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===d){ row.push(f); f=""; }
    else if(c==="\n"||c==="\r"){ if(c==="\r"&&text[i+1]==="\n") i++; row.push(f); rows.push(row); row=[]; f=""; }
    else f+=c; }
  if(f||row.length){ row.push(f); rows.push(row); }
  return rows.map(r=>r.map(x=>x.trim()));
}
function brokerNum(s){ s=String(s??"").trim(); if(!s||/^(--|-|n\/?a|null)$/i.test(s)) return null;
  const neg=/^\(.*\)$/.test(s)||/^-/.test(s.replace(/[$\s]/g,"")); const v=parseFloat(s.replace(/[^0-9.]/g,"")); return isFinite(v)?(neg?-v:v):null; }
const MMF=/^(FCASH|CORE|SPAXX|FDRXX|SPRXX|FZFXX|FZDXX|SWVXX|SNVXX|SNSXX|VMFXX|VMMXX|VUSXX|TTTXX)$/;
const isCash=t=>/\*\*$/.test(t)||MMF.test(t)||/\s/.test(t)&&/CASH|MONEY MARKET|SWEEP|PENDING/.test(t);
function parseBroker(text){
  const T=csvTable(text), norm=s=>s.toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
  let h=-1, col={};
  for(let i=0;i<Math.min(T.length,40)&&h<0;i++){
    const H=T[i].map(norm), find=re=>H.findIndex(x=>re.test(x));
    const sym=find(/^(symbol|ticker|ticker symbol|security symbol|symbol cusip|instrument symbol)$/), qty=find(/^(qty|quantity|shares|share quantity|qty quantity|quantity shares|units|shares held)$|^(quantity|qty)\b/);
    if(sym<0||qty<0) continue;
    h=i; const per=find(/\b(average|avg|unit)\b.*\bcost|cost (per )?share|price paid|cost price|purchase price/);
    col={sym,qty,per,tot:H.findIndex((x,j)=>j!==per&&/^(cost basis total|cost basis|total cost|total cost basis|cost|book value|cost basis \$)$/.test(x))};
  }
  if(h<0) return {error:"This file doesn't have a Symbol column and a Quantity column. In your broker's site, open Positions, choose Download or Export, and pick that file."};
  const got=new Map(), skip={cash:[],other:[]};
  for(const r of T.slice(h+1)){
    let t=(r[col.sym]||"").toUpperCase().trim(); if(!t) continue;
    const q=brokerNum(r[col.qty]);
    if(isCash(t)){ if(q&&!/\s/.test(t)) skip.cash.push(t.replace(/\*+$/,"")); else if(q) skip.cash.push("cash"); continue; }
    t=t.replace(/\//g,".");
    if(!/^[A-Z]{1,5}([.-][A-Z]{1,2})?$/.test(t)||q==null||q<=0){ if(q) skip.other.push(t); continue; }
    const tot=col.tot>=0?brokerNum(r[col.tot]):null, per=col.per>=0?brokerNum(r[col.per]):null;
    const c=per!=null&&per>=0?per*q:tot!=null&&tot>=0?tot:null;
    const e=got.get(t)||{t,shares:0,cost:0,known:true}; e.shares+=q; if(c==null) e.known=false; else e.cost+=c; got.set(t,e);
  }
  const rows=[...got.values()].map(e=>({t:e.t,shares:+e.shares.toFixed(6),cost:e.known?+(e.cost/e.shares).toFixed(4):null}));
  return {rows,skip,noCost:col.per<0&&col.tot<0};
}
function pickBrokerFile(){
  const inp=document.createElement("input"); inp.type="file"; inp.accept=".csv,.txt,text/csv";
  inp.onchange=async()=>{ const f=inp.files[0]; if(!f) return; if(f.size>4e6) return openImport({error:"That file is larger than a positions file usually is. Pick the positions or holdings download."},f.name);
    openImport(parseBroker(await f.text()),f.name); };
  inp.click();
}
function openImport(P,name){
  $("#imp")?.remove();
  const d=document.createElement("dialog"); d.className="sets imp"; d.id="imp"; d.setAttribute("aria-label","Import positions");
  document.body.appendChild(d); d.addEventListener("close",()=>d.remove()); d.addEventListener("click",e=>{ if(e.target===d) d.close(); });
  const have=(me?.positions||[]).length, rows=P.rows||[];
  let replace=have>0;
  const draw=(done)=>{
    const sk=P.skip||{cash:[],other:[]}, n=rows.length, noCost=rows.filter(r=>r.cost==null).length;
    const mm=[...new Set(sk.cash)].filter(x=>x!=="cash"), skipLine=[sk.cash.length?(mm.length?`cash and money market funds (${mm.slice(0,4).join(", ")})`:"cash"):"",sk.other.length?(sk.other.length===1?"1 line that isn't a stock or fund":`${sk.other.length} lines that aren't stocks or funds, such as options`):""].filter(Boolean).join(" and ");
    const body=P.error?`<p class="imsg">${esc(P.error)}</p>`
      :done?`<div class="idone">${ic("check",18)}<div><b>Imported ${done.imported} position${done.imported===1?"":"s"}.</b>${done.skipped?.length?`<small>No prices on Yahoo for ${esc(done.skipped.slice(0,8).join(", "))}${done.skipped.length>8?" and others":""}, so ${done.skipped.length===1?"it was":"they were"} left out.</small>`:""}</div></div>`
      :!n?`<p class="imsg">No stock or fund positions in this file.${skipLine?` It only had ${esc(skipLine)}.`:""}</p>`
      :`<p class="imsg">${n} position${n===1?"":"s"} found${skipLine?`. Leaving out ${esc(skipLine)}`:""}.${noCost?` ${noCost===n?"The file has no cost":"Some lines have no cost"}, so gains for ${noCost===n?"them":"those"} start from today's price.`:""}</p>
       <div class="itbl"><table><thead><tr><th class="l">Ticker</th><th>Shares</th><th>Cost per share</th><th>Cost</th></tr></thead><tbody>${rows.map(r=>`<tr><td class="l tk">${esc(r.t)}</td><td>${(+r.shares.toFixed(4)).toLocaleString("en-US")}</td><td>${r.cost==null?"–":money(r.cost)}</td><td>${r.cost==null?"–":"$"+Math.round(r.cost*r.shares).toLocaleString("en-US")}</td></tr>`).join("")}</tbody></table></div>
       ${have?`<div class="imode"><span>You have ${have} position${have===1?"":"s"} already.</span>${setSeg("imode",[["replace","Replace them"],["add","Add to them"]],replace?"replace":"add")}</div>`:""}`;
    d.innerHTML=`<div class="shead"><div><h2>Import positions</h2><small class="isub">${esc(name||"")}</small></div><button class="x" id="impX" aria-label="Close">${ic("close",16)}</button></div>
      <div class="sbody">${body}<p class="hint inote">${done?"":"Read on this Mac. Only the ticker, shares and cost are kept."}</p></div>
      <div class="ifoot"><span class="err" id="impErr"></span>${done||P.error||!n?`<button class="btn" id="impOk">${P.error||!n?"Close":"Done"}</button>`:`<button class="btn ghost" id="impNo">Cancel</button><button class="btn" id="impGo">${replace?"Replace with":"Import"} ${n} position${n===1?"":"s"}</button>`}</div>`;
    $("#impX").onclick=()=>d.close(); $("#impNo")&&($("#impNo").onclick=()=>d.close()); $("#impOk")&&($("#impOk").onclick=()=>d.close());
    d.querySelectorAll("[data-set-imode]").forEach(b=>b.onclick=()=>{ replace=b.dataset.setImode==="replace"; draw(); });
    $("#impGo")&&($("#impGo").onclick=async()=>{ const b=$("#impGo"); b.disabled=true; b.textContent="Importing…";
      try{ const r=await api("/api/me/positions/import",{rows,replace}); draw(r); }
      catch(x){ b.disabled=false; b.textContent=`${replace?"Replace with":"Import"} ${n} position${n===1?"":"s"}`; $("#impErr").textContent=x.message; } });
  };
  draw(); d.showModal();
}

/* editing in place: a position's purchases open under it (portfolio table, phone card, stock page), each change saves when you
   leave the field, and removals offer Undo. render() keeps focus and what you typed, so live prices don't interrupt. */
const lotOpen=new Set(), lotDraft={};
const splitTickers=v=>[...new Set(String(v).toUpperCase().split(/[\s,;]+/).map(x=>x.trim().replace(/\//g,".")).filter(Boolean))];
function keepFocus(fn){
  const a=document.activeElement, k=a?.dataset?.fk, v=a?.value, s0=a?.selectionStart, s1=a?.selectionEnd, ty=a?.type;
  fn();
  if(!k) return; const n=document.querySelector(`[data-fk="${CSS.escape(k)}"]`); if(!n||n===a) return;
  if(v!=null){ if(ty&&n.type!==ty) n.type=ty; n.value=v; } n.focus({preventScroll:true}); try{ if(s0!=null) n.setSelectionRange(s0,s1); }catch(e){}
}
const numTxt=x=>x==null||x===""?"":String(+(+x).toFixed(6));
function lotBtn(r){ const open=lotOpen.has(r.t); return `<button type="button" class="lotb" data-lot-open="${esc(r.t)}" aria-expanded="${open}" title="Change shares, cost or date">${open?"Done":`${ic("edit",13)}${r.lots>1?r.lots+" lots":"Edit"}`}</button>`; }
function lotEditor(t,ctx){
  const L=lots(t), last=lastValid(base?.px[t]||[]), d=lotDraft[t];
  const dateIn=(id,v)=>`<input data-lot-f="opened" data-fk="${ctx}:${id}:opened" type="${v?"date":"text"}" value="${esc(v||"")}" placeholder="Add date" aria-label="Date bought">`;

     <span class="lxg ${cls(last-p.cost)}">${pct(p.cost&&last?last/p.cost-1:null,1)}</span><span></span></div>`;

  return `<div class="lotx" data-lot-t="${esc(t)}"><div class="lx lxh"><span>Shares</span><span>Cost per share</span><span>Bought</span><span>Gain</span><span></span></div>
    ${L.map(p=>row(p.id,p)).join("")}${d?row("new",d):""}
    ${linked.length?`<div class="lxnote">${ic("link",12)}<span>From ${esc(linked.join(" and "))}, synced each trading day. Change ${linked.length>1?"those":"it"} there, or add your own purchases below.</span></div>`:""}
    <div class="lxf"><button type="button" class="lnk" data-lot-add="${esc(t)}" ${d?"hidden":""}>${ic("plus",13)}Add a purchase</button><span class="lxm" data-lot-msg></span>${ctx==="c"?`<button type="button" class="lnk lxdone" data-lot-open="${esc(t)}">Done</button>`:""}</div></div>`;

let toastT;
function toast(msg,undo){
  let el=$("#toast"); if(!el){ el=document.createElement("div"); el.id="toast"; el.className="toast"; el.setAttribute("role","status"); document.body.appendChild(el); }
  el.innerHTML=`<span>${esc(msg)}</span>${undo?`<button type="button">Undo</button>`:""}`; el.classList.add("on");
  if(undo) el.querySelector("button").onclick=()=>{ el.classList.remove("on"); undo(); };
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("on"),6000);
}
const sharesTxt=n=>`${(+(+n).toFixed(4)).toLocaleString("en-US")} share${+n===1?"":"s"}`;
function saveDraft(rowEl){   // what's typed in the new-purchase row, so a redraw (live prices) puts it back
  const t=rowEl.closest(".lotx").dataset.lotT, f=k=>rowEl.querySelector(`[data-lot-f="${k}"]`).value;
  lotDraft[t]={shares:f("shares").replace(/[,\s$]/g,""),cost:f("cost").replace(/[,\s$]/g,""),opened:f("opened")};
}
async function saveLot(rowEl){
  const box=rowEl.closest(".lotx"), t=box.dataset.lotT, id=rowEl.dataset.lot, msg=box.querySelector("[data-lot-msg]");
  const f=k=>rowEl.querySelector(`[data-lot-f="${k}"]`), sh=f("shares").value.replace(/[,\s$]/g,""), co=f("cost").value.replace(/[,\s$]/g,""), op=f("opened").value;
  // a new purchase saves when you leave its row (or press Enter), not on the first field you fill: Cost starts at
  // today's price, so saving on Tab out of Shares would add it at that price and pull the row out from under you
  if(id==="new"){ saveDraft(rowEl); if(sh===""||co===""||rowEl.contains(document.activeElement)||rowEl.dataset.saving) return; }
  const bad=[]; if(!(+sh>0)) bad.push("shares"); if(co===""||!(+co>=0)) bad.push("cost");
  rowEl.querySelectorAll("input").forEach(i=>i.classList.toggle("bad",bad.includes(i.dataset.lotF)));
  if(bad.length){ msg.className="lxm err"; msg.textContent=bad.includes("shares")?"Shares must be more than zero.":"Cost per share can't be negative."; return; }
  const o=id==="new"?null:(me.positions||[]).find(p=>p.id===+id);
  if(o&&+sh===+o.shares&&+co===+o.cost&&(op||"")===(o.opened||"")) return;
  msg.className="lxm"; msg.textContent="Saving…"; rowEl.dataset.saving="1";
  try{ await api("/api/me/positions/save",{lots:[{id:o?o.id:undefined,t,shares:sh,cost:co,opened:op}]}); if(id==="new") delete lotDraft[t];
    const m=document.querySelector(`.lotx[data-lot-t="${CSS.escape(t)}"] [data-lot-msg]`); if(m){ m.className="lxm"; m.textContent="Saved"; setTimeout(()=>{ if(m.textContent==="Saved") m.textContent=""; },1600); } }
  catch(x){ const m=document.querySelector(`.lotx[data-lot-t="${CSS.escape(t)}"] [data-lot-msg]`)||msg; m.className="lxm err"; m.textContent=x.message; }
  finally{ delete rowEl.dataset.saving; }
}
function refreshMine(){ keepFocus(()=>{ renderMine(); if(drawerOpen&&sel) renderDrawer(); }); }
document.addEventListener("change",e=>{ const i=e.target.closest?.(".lx input"), r=i?.closest(".lx"); if(!r) return;
  if(r.dataset.lot==="new"){ saveDraft(r); return; }   // saved by the focusout below, once you leave the row
  saveLot(r); });
document.addEventListener("focusout",e=>{ const r=e.target.closest?.('.lx[data-lot="new"]'); if(r&&!r.contains(e.relatedTarget)) setTimeout(()=>{ if(r.isConnected&&!r.contains(document.activeElement)) saveLot(r); },0); });
document.addEventListener("keydown",e=>{ const i=e.target.closest?.(".lx input"); if(!i) return;
  if(e.key==="Enter"){ e.preventDefault(); i.blur(); }
  else if(e.key==="Escape"){ e.stopPropagation(); i.value=i.defaultValue; i.classList.remove("bad"); i.blur(); } },true);
document.addEventListener("focusin",e=>{ const i=e.target; if(i.matches?.('.lx input[data-lot-f="opened"]')&&i.type==="text"){ i.type="date"; try{ i.showPicker?.(); }catch(x){} } });
document.addEventListener("focusout",e=>{ const i=e.target; if(i.matches?.('.lx input[data-lot-f="opened"]')&&!i.value) setTimeout(()=>{ if(document.activeElement!==i&&!i.value) i.type="text"; },0); });
document.addEventListener("click",e=>{
  const b=e.target.closest?.("[data-lot-open],[data-lot-add],[data-lot-del],[data-unwatch]"); if(!b) return;
  e.stopPropagation();
  if(b.dataset.lotOpen){ const t=b.dataset.lotOpen; if(lotOpen.has(t)){ lotOpen.delete(t); delete lotDraft[t]; } else lotOpen.add(t);
    refreshMine(); if(lotOpen.has(t)) document.querySelector(`.lotx[data-lot-t="${CSS.escape(t)}"] input`)?.focus({preventScroll:true}); return; }
  if(b.dataset.lotAdd){ const t=b.dataset.lotAdd, last=lastValid(base?.px[t]||[]); lotDraft[t]={shares:"",cost:last?last.toFixed(2):"",opened:""};
    const ctx=b.closest("#drMine")?"d":b.closest(".pcard")?"c":"p"; refreshMine(); document.querySelector(`[data-fk="${ctx}:new:shares"]`)?.focus(); return; }
  if(b.dataset.lotDel){ const box=b.closest(".lotx"), t=box.dataset.lotT;
    if(b.dataset.lotDel==="new"){ delete lotDraft[t]; refreshMine(); return; }
    const p=(me.positions||[]).find(x=>x.id===+b.dataset.lotDel); if(!p) return;
    if(lots(t).length===1){ lotOpen.delete(t); }
    api("/api/me/positions/save",{lots:[],delete:[p.id]}).then(()=>toast(`Removed ${sharesTxt(p.shares)} of ${t}`,()=>api("/api/me/positions/save",{lots:[{t,shares:p.shares,cost:p.cost,opened:p.opened}]}).catch(x=>toast(x.message)))).catch(x=>toast(x.message));
    return; }
  if(b.dataset.unwatch){ const t=b.dataset.unwatch; b.closest(".wr")?.remove();
    api("/api/me/watch",{t,on:false}).then(()=>toast(`Removed ${t} from your watchlist`,()=>api("/api/me/watch",{t,on:true}).catch(x=>toast(x.message)))).catch(x=>toast(x.message)); }
},true);

/* earnings calendar for the selected fund */
function reaction(t,date,hour){
  const a=base.px[t], i=base.dates.indexOf(date); if(!a||i<0) return null;
  if(hour!=null&&hour<12){ return a[i]!=null&&a[i-1]!=null?a[i]/a[i-1]-1:null; }
  return a[i+1]!=null&&a[i]!=null?a[i+1]/a[i]-1:null;
}
function renderEarnCal(){
  const el=$("#earnCal"); if(!el||!model) return;
  if(!Object.keys(EARN).length&&earnAt&&Date.now()-earnAt>60e3) earnAt=0;
  el.innerHTML=earnGrid(new Map(model.f.holdings.map(h=>[h.t,fund==="Watchlist"?null:h.w])),fund==="Portfolio"?"your portfolio":fund,isPseudo(fund));
}
function shiftDays(d,n){ const x=new Date(d+"T12:00:00Z"); x.setUTCDate(x.getUTCDate()+n); return x.toISOString().slice(0,10); }

async function loadEarnHist(t){
  if(earnHist[t]&&(earnHist[t].loading||Date.now()-earnHist[t].at<6*3600e3)) return;
  earnHist[t]={loading:true};
  try{ const r=await fetch("/api/earnhist?t="+encodeURIComponent(t)); earnHist[t]={rows:r.ok?await r.json():null,at:Date.now()}; }catch(e){ earnHist[t]={rows:null,at:Date.now()-5.9*3600e3}; }
  if(drawerOpen&&sel===t){ renderEarnHist(); drawPriceChart(); }
}
function renderEarnHist(){

  if(!h||h.loading){ el.innerHTML=`<div class="sk" style="height:120px"></div>`; return; }

/* ======================= ticker search ======================= */
let sItems=[], sIdx=-1, sTimer=null, sSeq=0;
function localMatches(q){
  const Q=q.toUpperCase(), m=new Map();
  FUND_ORDER.filter(f=>!isPseudo(f)).forEach(f=>(base?.funds[f]?.holdings||[]).forEach(h=>{ const e=m.get(h.t)||{t:h.t,n:h.n,funds:[]}; e.funds.push(`${f} ${h.w.toFixed(1)}%`); m.set(h.t,e); }));
  FUND_ORDER.filter(f=>!isPseudo(f)).forEach(f=>{ if(base?.funds[f]&&!m.has(f)) m.set(f,{t:f,n:base.funds[f].name,funds:["fund"]}); });
  (base?.extras||[]).forEach(t=>{ if(!m.has(t)) m.set(t,{t,n:searchNames[t]||detailCache[t]?.info?.longName||t,funds:[],exch:"recent"}); });
  const score=e=>{ const n=e.n.toUpperCase(); return e.t===Q?0:e.t.startsWith(Q)?1:n.startsWith(Q)?2:n.includes(Q)?3:9; };
  return [...m.values()].map(e=>[score(e),e]).filter(x=>x[0]<9).sort((a,b)=>a[0]-b[0]||a[1].t.length-b[1].t.length||a[1].t.localeCompare(b[1].t)).slice(0,6).map(x=>x[1]);
}
function showResults(){
  const el=$("#sres"); if(!sItems.length){ el.hidden=true; return; }
  el.hidden=false;
  el.innerHTML=sItems.map((e,i)=>e.cmd?`<button role="option" aria-selected="${i===sIdx}" data-cmd="${esc(e.cmd)}" class="cmd ${i===sIdx?"on":""}"><b>${ic(e.icon,15)}</b><span class="sn">${esc(e.label)}</span><span class="sf">${esc(e.hint)}</span></button>`
    :`<button role="option" aria-selected="${i===sIdx}" data-go="${esc(e.t)}" class="${i===sIdx?"on":""}"><b>${esc(e.t)}</b><span class="sn">${esc(e.n)}</span><span class="sf">${e.funds?.length?esc(e.funds.join(" · ")):esc(e.exch||"")}</span></button>`).join("");
}
function goTicker(t){ t=(t||"").trim().toUpperCase().replace(/[./ ]/g,"-"); if(!/^[A-Z][A-Z0-9-]{0,9}$/.test(t)) return; $("#ts").value=""; sItems=[]; showResults(); $("#ts").blur(); openDrawer(t); }
$("#ts").addEventListener("input",e=>{
  const q=e.target.value.trim(); sIdx=q?0:-1; const LM=q?localMatches(q):[], CM=q?commandMatches(q):[]; sItems=!q?quickItems():LM[0]&&LM[0].t===q.toUpperCase()?[LM[0],...CM,...LM.slice(1)]:[...CM,...LM]; if(q&&typeof withAsk==="function") sItems=withAsk(sItems,q); showResults(); clearTimeout(sTimer);
  if(!q) return; const seq=++sSeq;
  sTimer=setTimeout(async()=>{ try{ const rs=await (await fetch("/api/search?q="+encodeURIComponent(q))).json(); if(seq!==sSeq) return;
    const have=new Set(sItems.map(x=>x.t)); rs.forEach(x=>{ searchNames[x.t]=x.n; if(!have.has(x.t)&&sItems.length<9){ sItems.push(x); have.add(x.t); } }); if(typeof withAsk==="function") sItems=withAsk(sItems,q); if(sIdx<0&&sItems.length) sIdx=0; showResults(); }catch(err){} },220);
});
$("#ts").addEventListener("keydown",e=>{
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){ e.preventDefault(); if(!sItems.length) return; sIdx=(sIdx+(e.key==="ArrowDown"?1:-1)+sItems.length)%sItems.length; showResults(); }
  else if(e.key==="Enter"){ e.preventDefault(); const it=sItems[sIdx]; if(it?.cmd) runCmd(it); else goTicker(it?.t||e.target.value); }
  else if(e.key==="Escape"){ e.target.value=""; sItems=[]; showResults(); e.target.blur(); }
});
$("#ts").addEventListener("focus",e=>{ if(!e.target.value.trim()){ sItems=quickItems(); sIdx=-1; } showResults(); });

document.addEventListener("change",e=>{ const id=e.target.dataset?.alTog; if(id) api("/api/me/alert/toggle",{id:+id,on:e.target.checked}).catch(()=>{}); });

/* ======================= data plumbing ======================= */
/* issuers' holdings files use legal names in odd case ("Jpmorgan Chase + Co", "Procter + Gamble Co/The"); show them as people write them */
const NAME_FIX={Jpmorgan:"JPMorgan","Amazon.Com":"Amazon.com",Exxonmobil:"ExxonMobil",Abbvie:"AbbVie",Unitedhealth:"UnitedHealth",Rtx:"RTX",Ge:"GE",Kla:"KLA",
  Pepsico:"PepsiCo","Mcdonald S":"McDonald's",Crowdstrike:"CrowdStrike",Intl:"International",Of:"of",And:"and",The:"the",Kkr:"KKR",Mclennan:"McLennan","Coca Cola":"Coca-Cola",
  "Sherwin Williams":"Sherwin-Williams",Paypal:"PayPal",Autozone:"AutoZone",Blackrock:"BlackRock",Servicenow:"ServiceNow",Doordash:"DoorDash",Fedex:"FedEx",Ebay:"eBay",
  Iqvia:"IQVIA",Hca:"HCA",Csx:"CSX",Cvs:"CVS",Ibm:"IBM",Amd:"AMD",Asml:"ASML",Tsmc:"TSMC",Nxp:"NXP",Cme:"CME",Ppg:"PPG",Dte:"DTE",Aes:"AES",Nrg:"NRG",Ptc:"PTC",Lkq:"LKQ",
  Dupont:"DuPont",Mckesson:"McKesson",Hp:"HP",Ups:"UPS",Usa:"USA",Us:"US",Ii:"II",Iii:"III",Ai:"AI",Nvr:"NVR",Ametek:"AMETEK",Tjx:"TJX",Cbre:"CBRE",Bny:"BNY",Ebay:"eBay",
  Gamestop:"GameStop",Linkedin:"LinkedIn",Moderna:"Moderna",Smurfit:"Smurfit",Fortinet:"Fortinet",Synopsys:"Synopsys",Arista:"Arista",Applovin:"AppLovin",Datadog:"Datadog",
  Mongodb:"MongoDB",Gopro:"GoPro",Marketaxess:"MarketAxess",Onsemi:"onsemi",Globalfoundries:"GlobalFoundries",Microchip:"Microchip",Robinhood:"Robinhood",Coinbase:"Coinbase"};
function niceName(n,keepClass=true){
  if(!n||/[a-z]/.test(n)===false&&n.length<6) return n;
  n=String(n).replace(/\s+/g," ").trim().replace(/\s*\+\s*/g," & ").replace(/\bAt & T\b/,"AT&T").replace(/\bS & P\b/,"S&P").replace(/\bM & T\b/,"M&T").replace(/\bP G & E\b/,"PG&E").replace(/\/The\b/,"");
  let cl=""; n=n.replace(/\s+(?:Cl|Class)\s+([A-C])(?:\s+Shares)?$|\s+([A-C])$/,(m,a,b)=>{ cl=` Class ${a||b}`; return ""; });
  for(let k=0;k<3;k++) n=n.replace(/[\s,]+(Inc|Corp|Corporation|Co|Cos|Company|Ltd|Plc|Lp|Nv|Sa|Ag)\.?$/i,"");
  n=n.replace(/\s*&$/,"");
  Object.entries(NAME_FIX).forEach(([k,v])=>{ n=n.replace(new RegExp(`(^|\\s)${k.replace(/[.]/g,"\\.")}(?=\\s|$)`,"g"),(m,p)=>p+v); });
  n=n.replace(/^(\w)/,c=>c.toUpperCase()).replace(/^ExxonMobil Holdings$/,"Exxon Mobil");
  return keepClass?n+cl:n;
}
/* Yahoo's sector names, said the way the Market page says them */
const SECTOR_NAME={"Financial Services":"Financials","Consumer Cyclical":"Consumer discretionary","Consumer Defensive":"Consumer staples","Healthcare":"Health care",
  "Basic Materials":"Materials","Communication Services":"Communication","Real Estate":"Real estate","Etf":"Funds","Equity":"Other"};
async function getBase(){ const r=await fetch("/api/base");
  if(r.status===503){ const w=await r.json().catch(()=>({})), h=$("#bootStep"); if(h&&w.step) h.textContent=w.step+"…"; return; }   // first launch, still downloading
  const b=await r.json(); for(const t in b.sectors||{}){ const v=b.sectors[t]; if(typeof v==="string"&&SECTOR_NAME[v]) b.sectors[t]=SECTOR_NAME[v]; } { const H=Object.values(b.funds||{}).flatMap(f=>f.holdings||[]), seen=new Map();   // a share class only matters when a company has two
    H.forEach(h=>{ const k=niceName(h.n,false); if(!seen.has(k)) seen.set(k,new Set()); seen.get(k).add(h.t); });
    H.forEach(h=>{ const k=niceName(h.n,false); h.n=seen.get(k).size>1?niceName(h.n):k; }); } if(!me) await loadMe(); base=b; for(const k in startCache) delete startCache[k]; buildPseudo(); if(!base.funds[fund]) fund="SPY"; render();
  if(!hashDone){ hashDone=true; if(hashT) openDrawer(hashT); else setHash(); } }
async function poll(){
  try{
    const L=await (await fetch("/api/live")).json(); liveInfo=L;
    const xs=JSON.stringify(L.ext||{}), extNew=xs!==extSig; if(extNew){ extSig=xs; EXT=L.ext||{}; }
    if(!base||L.v!==base.v) await getBase();
    else{
      let changed=extNew; const fl={};
      for(const [t,v] of Object.entries(L.last)){ const a=base.px[t]; if(!a||v==null) continue; const old=a[a.length-1]; if(old!==v){ a[a.length-1]=v; changed=true; if(old!=null) fl[t]=v>old?"flash-up":"flash-down"; } }
      if(changed){ flashes=fl; if(!document.hidden&&Date.now()-lastRender>4000) render(); }
    }
    setStatus(L);
  }catch(e){ $("#dot").className="dot warn"; $("#status").textContent="Can't reach OpenTicker on this Mac. Run openticker start in Terminal."; }
}
function setStatus(L){
  const age=L.lastTick?Math.round(L.now-L.lastTick):null,dot=$("#dot"),st=$("#status");
  const t=new Date().toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit",second:"2-digit"});
  if(age!=null&&age<90){dot.className="dot on";st.textContent=`Live · updated ${t}`;}
  else if(L.lastPoll&&L.now-L.lastPoll<180){dot.className="dot warn";st.textContent=`Stream quiet, polling · ${t}`;}
  else if(L.open){const last=Math.max(L.lastTick||0,L.lastPoll||0);dot.className="dot warn";st.textContent=last?`Prices delayed · last update ${new Date(last*1000).toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"})}`:"Market open · waiting for prices";}
  else{dot.className="dot";st.textContent=`Market closed · as of ${shortDate(L.date)} close`;}
  dot.title=st.textContent;   // the text hides on narrow headers; the dot still explains itself on hover
}
poll(); setInterval(poll,3000); setInterval(loadMe,30000);
