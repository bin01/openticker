<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d100f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OpenTicker">
<link rel="manifest" href="/static/app.webmanifest">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<title>OpenTicker</title>
<link rel="preload" href="/static/fonts/inter-variable.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* One typeface everywhere: Inter (variable, bundled locally, SIL OFL). Numbers use its tabular figures. */
@font-face{font-family:"Inter";src:url(/static/fonts/inter-variable.woff2) format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
/* Layout: a market desk. Sticky controls, a pulse strip across the four funds, a written read of the tape,
   then map + drivers, leadership + rotation, and the full roster. A drawer slides in for any one stock. */
:root{
  --bg:#f4f5f2; --panel:#ffffff; --raise:#fbfbfa; --ink:#121513; --ink-2:#4b524e; --ink-3:#7c847f;
  --rule:#e1e4df; --grid:#eceeea; --accent:#2b59d6; --accent-soft:#e7ecfb;
  --up:#12804e; --up-soft:#dcefe4; --down:#c53b31; --down-soft:#f7e1de; --fund:#121513;
  --tile-0:#e9ebe7; --tile-up:#0f8a52; --tile-down:#d23a2f; --tile-ink:#ffffff; --tile-ink-0:#2b302d; --warn:#b7791f;
  --shadow:0 1px 2px rgba(18,21,19,.05),0 8px 24px rgba(18,21,19,.06); --glow:rgba(43,89,214,.07);
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-display:var(--f-body);
  --f-mono:var(--f-body);
  --f-code:ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d100f; --panel:#151917; --raise:#1a1f1c; --ink:#eef1ee; --ink-2:#b2bab4; --ink-3:#7c857f;
  --rule:#252b28; --grid:#1f2522; --accent:#86a5f3; --accent-soft:#1c2540;
  --up:#41c585; --up-soft:#15301f; --down:#f2685d; --down-soft:#391b18; --fund:#eef1ee;
  --tile-0:#262c29; --tile-up:#1f9e62; --tile-down:#d9473c; --tile-ink:#ffffff; --tile-ink-0:#d5dad6; --warn:#e0a948;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --glow:rgba(134,165,243,.09); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d100f; --panel:#151917; --raise:#1a1f1c; --ink:#eef1ee; --ink-2:#b2bab4; --ink-3:#7c857f;
  --rule:#252b28; --grid:#1f2522; --accent:#86a5f3; --accent-soft:#1c2540;
  --up:#41c585; --up-soft:#15301f; --down:#f2685d; --down-soft:#391b18; --fund:#eef1ee;
  --tile-0:#262c29; --tile-up:#1f9e62; --tile-down:#d9473c; --tile-ink:#ffffff; --tile-ink-0:#d5dad6; --warn:#e0a948;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --glow:rgba(134,165,243,.09); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;font-optical-sizing:auto}
.wrap{max-width:1400px;margin:0 auto;padding-inline:max(20px,env(safe-area-inset-left,0px)) max(20px,env(safe-area-inset-right,0px))}
main.wrap{padding-block:0 56px;display:flex;flex-direction:column;gap:16px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--ink-2)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* tabular figures for data; prose keeps natural spacing (Inter's tabular set also widens hyphens) */
p,.ins li,.bt,.blead,.bl,.ptitle,h2,h3,.sub,.read p,.sn,.qn{font-variant-numeric:normal}
kbd{font:500 11px var(--f-body);border:1px solid var(--rule);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--ink-2);background:var(--raise)}

/* header */
header.bar{position:sticky;top:0;z-index:15;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--rule)}
.bar-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:12px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand b{font:700 19px/1 var(--f-display);letter-spacing:-.02em}
.brand span{font:500 11px/1 var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:9px;background:var(--panel);padding:2px;gap:2px}
.seg button{border:0;background:none;padding:6px 11px;border-radius:7px;cursor:pointer;font:600 13px/1 var(--f-body);color:var(--ink-2);transition:background .15s,color .15s}
.seg button:hover{color:var(--ink);background:var(--grid)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.live{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:none}
.dot.on{background:var(--up);animation:pulse 2s infinite}
.dot.warn{background:var(--warn)}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--up) 55%,transparent)}100%{box-shadow:0 0 0 9px transparent}}

/* pulse strip */
.pulse{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:18px}
.pcard{position:relative;text-align:left;border:1px solid var(--rule);background:var(--panel);border-radius:14px;padding:14px 16px 10px;cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s;min-width:0}
.pcard:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.pcard[aria-pressed="true"]{border-color:var(--ink);box-shadow:var(--shadow)}
.pcard .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pcard .tk{font:700 16px/1 var(--f-display);letter-spacing:-.01em}
.pcard .nm{font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .r{font:600 26px/1.1 var(--f-mono);margin-top:8px;letter-spacing:-.02em}
.pcard .meta{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-2);margin-top:2px;gap:8px}
.pcard svg{display:block;width:100%;height:38px;margin-top:6px;overflow:hidden}
.sp{display:inline-block;width:90px;height:24px;vertical-align:middle}.sp svg{display:block;width:90px;height:24px}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:28px;align-items:stretch;padding:26px 28px;background:var(--panel);border:1px solid var(--rule);border-radius:18px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(900px 300px at 0% 0%,var(--glow),transparent 60%);pointer-events:none}
.hero>*{position:relative;min-width:0}
.eyebrow{display:flex;align-items:center;gap:10px;font:600 11px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.big-r{font:700 clamp(46px,6vw,76px)/1 var(--f-mono);letter-spacing:-.035em;margin:14px 0 6px;font-variant-numeric:tabular-nums}
.big-sub{color:var(--ink-2);font-size:13px}
.hero .read{margin-top:18px;display:block;background:none;border:0;padding:0}
.hero .read p{font:500 17px/1.55 var(--f-body);color:var(--ink);max-width:62ch;margin:10px 0 0}
.hero .read p b{font-weight:650}
.tag{display:inline-flex;align-items:center;gap:6px;font:700 11px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;padding:6px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.hchart{display:flex;flex-direction:column;min-height:260px}
.hchart .legend{margin-bottom:6px}
.hchart svg{flex:1}
.sw{display:inline-block;width:16px;height:3px;border-radius:2px}

/* section nav + tape */
.subnav{position:sticky;top:var(--hdr,57px);z-index:12;display:flex;gap:4px;padding:8px 0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);margin-top:-6px}
.subnav a{font:600 12.5px/1 var(--f-body);color:var(--ink-3);text-decoration:none;padding:7px 11px;border-radius:999px;transition:color .15s,background .15s}
.subnav a:hover{color:var(--ink)}
.subnav a.on{color:var(--ink);background:var(--panel);box-shadow:inset 0 0 0 1px var(--rule)}
section[id^="s-"]{scroll-margin-top:120px}
.tape{border-top:1px solid var(--rule);overflow:hidden;white-space:nowrap;font:500 12px/1 var(--f-mono);color:var(--ink-2);mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
.tape-in{display:inline-flex;gap:26px;padding:8px 0;animation:tape 70s linear infinite}
.tape:hover .tape-in{animation-play-state:paused}
.tape b{color:var(--ink);font-weight:600;margin-right:6px;cursor:pointer}
.tape .lab{font-family:var(--f-body);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:10.5px;color:var(--ink-3)}
@keyframes tape{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.theme{border:1px solid var(--rule);background:var(--panel);border-radius:9px;height:30px;padding:0 10px;cursor:pointer;font:600 12px var(--f-body);color:var(--ink-2)}
.theme:hover{color:var(--ink)}

/* hover cross-highlight */
.tile.hl{outline:2px solid var(--ink);z-index:4;filter:brightness(1.08)}
g.hl>rect:first-child{fill:var(--grid)}
.hl-on #rotation g[data-sel]:not(.hl) circle{opacity:.18;transition:opacity .15s}
.hl-on #rotation g.hl circle{stroke:var(--ink);stroke-width:2;fill-opacity:.95}
tr.hl{background:var(--grid)}
.mx tr.hl td.l{color:var(--accent)}
.tile.tick-up{animation:tu 1.2s}.tile.tick-down{animation:td 1.2s}
@keyframes tu{0%{box-shadow:inset 0 0 0 3px var(--up-soft)}100%{box-shadow:inset 0 0 0 0 transparent}}
@keyframes td{0%{box-shadow:inset 0 0 0 3px var(--down-soft)}100%{box-shadow:inset 0 0 0 0 transparent}}

/* skeleton */
.skel{display:grid;gap:16px;margin-top:18px}
.skel i{display:block;border-radius:14px;background:linear-gradient(90deg,var(--grid),var(--raise),var(--grid));background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes sh{from{background-position:100% 0}to{background-position:-100% 0}}

/* headline */
.read{display:flex;gap:14px;align-items:flex-start;background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:16px 18px}
.read p{margin:0;font:500 16px/1.5 var(--f-body);text-wrap:pretty;max-width:110ch}
.read p b{font-weight:600}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;padding:4px 0}
.kpis>div{padding:6px 18px;min-width:0;border-left:1px solid var(--rule)}
.kpis>div:first-child{border-left:0;padding-left:4px}
.lbl{font:600 10.5px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);display:flex;gap:6px;align-items:center}
.kv{font:600 22px/1.1 var(--f-mono);margin-top:8px;letter-spacing:-.01em}
.ks{color:var(--ink-2);font-size:12px;margin-top:5px}
.meter{height:6px;border-radius:3px;background:var(--grid);margin-top:9px;overflow:hidden;display:flex;gap:2px}
.meter i{display:block;height:100%;border-radius:3px}
.duo{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center;margin-top:8px;font-size:12px;color:var(--ink-2)}
.duo .meter{margin:0}
.chip{display:inline-flex;align-items:center;gap:5px;font:600 11px/1 var(--f-body);padding:4px 7px;border-radius:999px;background:var(--grid);color:var(--ink-2);white-space:nowrap}
.chip.up{background:var(--up-soft);color:var(--up)} .chip.down{background:var(--down-soft);color:var(--down)}

/* panels */
.row{display:grid;gap:16px;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.row.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:18px;padding:20px 22px;min-width:0}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.ph h2{font:700 17px/1.25 var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.hint{color:var(--ink-3);font-size:12px;margin-top:3px;max-width:70ch}
svg text{font-family:var(--f-body)}
svg .mono{font-family:var(--f-mono)}
.chart{width:100%;display:block}
[data-sel]{cursor:pointer}
.legend{display:flex;gap:12px;font-size:11.5px;color:var(--ink-2);flex-wrap:wrap;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.ramp{width:120px;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--tile-down),var(--tile-0),var(--tile-up))}

/* treemap */
.map{position:relative;height:480px;overflow:hidden;background:var(--panel)}
.sec{position:absolute}
.sec-l{position:absolute;left:1px;top:0;right:1px;height:18px;padding:3px 4px;font:700 10px/12px var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:1}
.tile{position:absolute;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;transition:filter .12s;text-align:center;line-height:1.1}
.tile:hover{filter:brightness(1.08) saturate(1.1);z-index:2}
.tile .a{font-family:var(--f-display);font-weight:700;letter-spacing:-.01em}
.tile .b{font-family:var(--f-mono);font-weight:500;opacity:.92}
.tile.sel{outline:2px solid var(--ink);z-index:3}

/* matrix */
.mx-wrap{overflow-x:auto}
table.mx{border-collapse:separate;border-spacing:2px;width:100%;min-width:560px}
.mx th{font:600 10.5px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:4px 6px;text-align:center}
.mx th.l{text-align:left}
.mx td{padding:0;height:26px;text-align:center;font:500 11.5px var(--f-mono);border-radius:4px}
.mx td.l{text-align:left;padding:0 6px;font:600 12.5px var(--f-mono);white-space:nowrap}
.mx td.l small{font:400 11px var(--f-body);color:var(--ink-3);margin-left:6px}
.mx td.w{color:var(--ink-2);font-size:11px}
.mx tr:hover td.l{color:var(--accent)}
.mx th.cur{color:var(--ink)}
.rs{display:inline-block;min-width:26px;padding:3px 5px;border-radius:5px;font:600 11px var(--f-mono)}

/* table */
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--rule);background:var(--panel);padding:5px 10px;border-radius:999px;cursor:pointer;font:600 12px var(--f-body);color:var(--ink-2)}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input[type=search]{font:inherit;padding:7px 10px;border:1px solid var(--rule);border-radius:9px;background:var(--bg);color:var(--ink);width:220px;max-width:100%}
.tbl-wrap{overflow:auto;margin-top:6px;max-height:680px;border-top:1px solid var(--grid)}
.hc{display:inline-block;padding:2px 6px;border-radius:5px;min-width:64px}
table.hold{border-collapse:collapse;width:100%;min-width:1060px}
.hold th,.hold td{padding:7px 9px;text-align:right;border-bottom:1px solid var(--grid);white-space:nowrap}
.hold th{font:600 10.5px/1.2 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);cursor:pointer;user-select:none;position:sticky;top:0;background:var(--panel)}
.hold th:hover{color:var(--ink)}
.hold th.l,.hold td.l{text-align:left}
.hold td.name{color:var(--ink-2);max-width:200px;overflow:hidden;text-overflow:ellipsis}
.hold td.sector{color:var(--ink-3);font-size:12px;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.hold tbody tr{cursor:pointer;transition:background .1s}
.hold tbody tr:hover{background:var(--grid)}
.hold tbody tr.sel{background:var(--accent-soft)}
.hold td.tk{font:600 13px var(--f-mono)}
.cbar{display:inline-block;height:8px;border-radius:2px;vertical-align:middle;margin-left:6px}
.rng{display:inline-block;position:relative;width:64px;height:6px;border-radius:3px;background:var(--grid);vertical-align:middle;margin-right:6px}
.rng i{position:absolute;top:-2px;width:3px;height:10px;border-radius:2px;background:var(--ink)}
.flash-up{animation:fu 1.4s}.flash-down{animation:fd 1.4s}
@keyframes fu{0%{background:var(--up-soft)}100%{background:transparent}}
@keyframes fd{0%{background:var(--down-soft)}100%{background:transparent}}
.more{margin-top:10px;border:1px solid var(--rule);background:var(--bg);padding:7px 12px;border-radius:9px;cursor:pointer}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,12,11,.32);opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,100vw);background:var(--panel);border-left:1px solid var(--rule);box-shadow:-20px 0 40px rgba(0,0,0,.12);transform:translateX(104%);transition:transform .25s cubic-bezier(.2,.8,.2,1);z-index:31;overflow-y:auto;padding:20px 22px 40px;padding-right:max(22px,env(safe-area-inset-right,0px))}
.drawer.open{transform:none}
.dr-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dr-h h3{margin:0;font:700 28px/1 var(--f-display);letter-spacing:-.02em}
.dr-h .nm{color:var(--ink-2);margin-top:4px}
.x{border:1px solid var(--rule);background:var(--raise);border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:18px;line-height:1}
.dr-price{display:flex;align-items:baseline;gap:10px;margin-top:14px}
.dr-price .p{font:600 30px/1 var(--f-mono)}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.dr-sec{margin-top:20px}
.dr-sec h4{margin:0 0 8px;font:600 10.5px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
table.hz{width:100%;border-collapse:collapse;font-size:13px}
.hz th,.hz td{padding:6px 4px;text-align:right;border-bottom:1px solid var(--grid)}
.hz th{font:600 10.5px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.hz td:first-child,.hz th:first-child{text-align:left}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--raise);border:1px solid var(--grid);border-radius:10px;padding:10px 12px}
.stat .v{font:600 17px/1.2 var(--f-mono);margin-top:4px}

.kf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px;padding:12px 0;border-top:1px solid var(--grid);border-bottom:1px solid var(--grid)}
.kf:empty{display:none}
.kf .v,.an .v{font:600 16px/1.25 var(--f-mono);margin-top:4px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid3 .stat .v{font-size:15px}
.ch-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.seg.sm button{padding:5px 8px;font-size:12px}
.vs{font-size:12px;color:var(--ink-2);display:flex;gap:5px;align-items:center;cursor:pointer;white-space:nowrap}
.ch-sum{font-size:13px;margin-bottom:4px;min-height:18px}
.ch-sum .hint{display:inline;margin:0}
.sk{border-radius:10px;background:linear-gradient(90deg,var(--grid),var(--raise),var(--grid));background-size:200% 100%;animation:sh 1.4s infinite}
.an{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.meter{position:relative;height:8px;border-radius:4px;margin-top:10px;background:linear-gradient(90deg,var(--up),var(--grid) 50%,var(--down))}
.meter i,.tgt i{position:absolute;top:-3px;width:10px;height:14px;border-radius:3px;background:var(--ink);border:2px solid var(--panel)}
.meter-l{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-3);margin-top:5px;gap:6px}
.tgt{position:relative;height:8px;border-radius:4px;margin-top:10px;background:var(--grid)}

@media (max-width:600px){.sbar{grid-template-columns:minmax(0,1fr) 58px;row-gap:6px}.sbar .strk{grid-column:1/-1;grid-row:2}.rchg td:nth-child(3),.fct th:last-child,.fct td:last-child{display:none}#ts{width:100%}.skbd{display:none}.mainnav a{padding:8px 10px}.clist li{grid-template-columns:56px minmax(0,1fr) auto}.clist li>span:nth-child(4){display:none}}

/* ===== v8: icons, brief, x-ray, chart events, command bar, phone tab bar ===== */
.ic{display:block;flex:none}
.iconbtn{width:34px;padding:0;display:grid;place-items:center;color:var(--ink-2)}
.iconbtn:hover{color:var(--ink)}
.x{display:grid;place-items:center;color:var(--ink-2)}.x:hover{color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:6px}
.btn .ic{margin-left:-2px}
#drW[aria-pressed="true"] .ic{color:var(--warn)}
.star .ic{margin:auto}
.sres button.cmd b{display:flex;align-items:center;justify-content:center;min-width:56px;color:var(--ink-3)}
.sres button.cmd .sn{color:var(--ink)}
header.bar{padding-top:env(safe-area-inset-top,0px)}

/* brief */
.blead{font:400 16px/1.55 var(--f-body);color:var(--ink-2);margin:2px 0 12px;max-width:95ch;text-wrap:pretty}
.blead b{color:var(--ink);font-weight:600}
.pend{display:inline-flex;align-items:center;gap:6px;margin-left:6px;color:var(--ink-2)}
.pend .dot{width:6px;height:6px}
.brief{list-style:none;margin:0 0 4px;padding:0;border-top:1px solid var(--grid)}
.brief li{border-bottom:1px solid var(--grid)}
.bl{display:grid;grid-template-columns:8px 58px minmax(0,1fr) auto;gap:12px;align-items:baseline;width:100%;border:0;background:none;text-align:left;padding:10px 8px;cursor:pointer;color:var(--ink);font-size:13.5px;border-radius:8px}
.bl:hover{background:var(--grid)}
.bl>i{width:8px;height:8px;border-radius:50%;background:var(--ink-3);opacity:.55;align-self:start;margin-top:.5em}
.brief li.up .bl>i{background:var(--up);opacity:1}.brief li.down .bl>i{background:var(--down);opacity:1}
.btk{font:600 13px var(--f-mono)}
.bt{color:var(--ink-2);line-height:1.45}.bt b{color:var(--ink);font-weight:600}
.bw{font-size:12px;color:var(--ink-3);white-space:nowrap}
.mside .brief{border-top:0}.mside .bl{grid-template-columns:8px 48px minmax(0,1fr);padding:7px 4px;font-size:12.5px}.mside .bw{display:none}

/* x-ray */
.xray{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px 40px;align-items:start}
.xray .ins{margin-top:0}
.xray .kf{grid-template-columns:repeat(3,minmax(0,1fr));margin-top:18px}
.xs{display:grid;gap:3px}
.xr{display:grid;grid-template-columns:minmax(110px,170px) minmax(0,1fr) 40px 34px;gap:10px;align-items:center;font-size:13px;padding:3px 0}
.xn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.xb{display:grid;gap:2px}
.xb i{display:block;height:7px;border-radius:3px;min-width:1px}
.xb i.me{background:var(--accent)}.xb i.mk{background:var(--ink-3);opacity:.4}
.xv{text-align:right;font-weight:600}.xd{text-align:right;font-size:12px;color:var(--ink-3)}

/* chart events */
.vsg{display:flex;gap:14px;align-items:center}
.evkey{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11.5px;color:var(--ink-3);margin-top:6px}
.evkey span{display:inline-flex;align-items:center;gap:5px}
.ek{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;font:700 8.5px/1 var(--f-body);font-style:normal;color:var(--ink-3)}
.ek.e{background:var(--ink-3);color:var(--panel)}.ek.o{border:1.4px solid var(--ink-3)}.ek.o.up{border-color:var(--up);color:var(--up)}

/* motion */
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#app>section,#app>.page,#app>nav{animation:rise .34s cubic-bezier(.2,.8,.2,1) both}
#app>section:nth-child(2){animation-delay:.03s}#app>section:nth-child(3){animation-delay:.06s}#app>section:nth-child(4){animation-delay:.09s}
#drPane:not([hidden]),#drOverview:not([hidden]){animation:rise .25s cubic-bezier(.2,.8,.2,1) both}

/* phone tab bar */
.tabbar{display:none}
@media (max-width:760px){
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--panel) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--rule);padding:6px 4px max(8px,env(safe-area-inset-bottom,0px))}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;color:var(--ink-3);text-decoration:none;font:600 10.5px/1.1 var(--f-body)}
  .tabbar a.on{color:var(--ink)}.tabbar a.on .ic{color:var(--accent)}
  body{padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
  .mainnav{display:none}
  .xray{grid-template-columns:1fr}.xray .kf{grid-template-columns:1fr 1fr}
  .xr{grid-template-columns:minmax(0,120px) minmax(0,1fr) 36px 30px;gap:8px}
  .bl{grid-template-columns:8px 50px minmax(0,1fr);gap:10px}.bl .bw{grid-column:3;font-size:11.5px;margin-top:-4px}
}

/* ===== v9: Ask (agents on your Mac) ===== */
.askbtn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px 0 9px;border:1px solid var(--rule);border-radius:9px;background:var(--panel);color:var(--ink);font:600 13px var(--f-body);cursor:pointer;transition:border-color .15s,background .15s}
.askbtn .ic,.askact .ic{color:var(--accent)}
.askbtn:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--rule))}
body.asking .askbtn{background:var(--grid);border-color:transparent}
/* Tick: a floating card docked beside the page on wide screens, a sheet elsewhere.
   Modeled on HyperFrames' chat column: an inset card, a compact header with the agent as a pill, prose without
   bubbles, a quiet work log, and one composer that holds everything. Tick himself perches on the composer. */
:root{--tick-w:392px;--tick-gap:10px}
body.tick-docked{padding-right:calc(var(--tick-w) + var(--tick-gap))}
body.tick-docked .drawer,body.tick-docked .scrim,body.tick-docked .side2{right:calc(var(--tick-w) + var(--tick-gap))}
body.tick-docked .drawer.full{left:0;width:auto}
body.tick-docked .drawer:not(.open){transform:translateX(calc(100% + var(--tick-w) + 48px))}
.ask{--tk-line:color-mix(in srgb,var(--ink) 9%,transparent);--tk-fill:color-mix(in srgb,var(--ink) 4%,var(--panel));
  position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:38;background:var(--panel);border-left:1px solid var(--rule);box-shadow:-24px 0 48px rgba(0,0,0,.14);display:flex;flex-direction:column;font-size:14px;transform:translateX(104%);visibility:hidden;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s .3s}
.ask.open{transform:none;visibility:visible;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.ask.docked{top:var(--tick-gap);right:var(--tick-gap);bottom:var(--tick-gap);width:var(--tick-w);z-index:25;border:1px solid var(--rule);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.ask.docked:not(.open){transform:translateX(calc(100% + 24px))}

/* header: name, the agent as a pill, three quiet buttons */
.ask-h{display:flex;align-items:center;gap:6px;padding:10px 8px 10px 16px;min-height:52px;box-sizing:border-box;position:relative;border-bottom:1px solid transparent;transition:border-color .2s}
.ask-h.lined{border-bottom-color:var(--grid)}
.ask-nm{font:700 15px/1 var(--f-body);letter-spacing:-.015em;color:var(--ink);margin-right:2px}
.ask-prov{display:inline-flex;align-items:center;gap:6px;height:28px;max-width:180px;border:0;background:none;font:500 12.5px var(--f-body);color:var(--ink-2);cursor:pointer;padding:0 7px 0 8px;border-radius:8px;white-space:nowrap;transition:background .15s,color .15s}
.ask-prov span{overflow:hidden;text-overflow:ellipsis}
.ask-prov .ic{color:var(--ink-3);flex:none}
.ask-prov:hover,.ask-prov[aria-expanded="true"]{background:var(--tk-fill);color:var(--ink)}
.ask :focus-visible{outline:2px solid color-mix(in srgb,var(--ink) 28%,transparent);outline-offset:1px}
.pdot{width:6px;height:6px;border-radius:50%;background:var(--ink-3);flex:none}
.pdot.on{background:var(--up)}
.ask-hb{display:flex;gap:2px;margin-left:auto}
.ask-hb .x{width:30px;height:30px;border:0;background:none;border-radius:8px;cursor:pointer;color:var(--ink-3);display:grid;place-items:center;transition:background .15s,color .15s}
.ask-hb .x:hover,.ask-hb .x.on{background:var(--tk-fill);color:var(--ink)}

.ask-b{flex:1;overflow-y:auto;padding:14px 18px 42px;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--rule) transparent}

/* the composer: one rounded box; the words on top, what Tick looks at and send underneath */
.ask-f{padding:0 12px calc(12px + env(safe-area-inset-bottom,0px));position:relative}
.ask-f.off .ask-in{opacity:.45;pointer-events:none}
.ask-in{position:relative;border:1px solid var(--tk-line);border-radius:18px;background:var(--tk-fill);padding:12px 10px 10px 14px;transition:border-color .15s,background .15s}
.ask-in:focus-within{border-color:color-mix(in srgb,var(--ink) 22%,transparent);background:var(--panel)}
#askQ{display:block;width:100%;box-sizing:border-box;border:0;background:none;resize:none;font:400 14px/1.5 var(--f-body);color:var(--ink);outline:none;max-height:180px;min-height:42px;padding:0 2px 0 0;margin:0}
#askQ::placeholder{color:var(--ink-3)}
.ask-row{display:flex;align-items:center;gap:6px;margin-top:8px;min-height:30px}
.ask-ctxr{display:flex;flex-wrap:wrap;gap:5px;min-width:0;flex:1}
.ctxchip{display:inline-flex;align-items:center;gap:5px;height:28px;border:1px solid var(--tk-line);background:var(--panel);border-radius:9px;padding:0 8px;font:500 12.5px var(--f-body);color:var(--ink-2);cursor:pointer;max-width:100%;box-sizing:border-box;transition:border-color .15s,color .15s}
.ctxchip b{font-weight:600;color:var(--ink)}
.ctxchip small{color:var(--ink-3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctxchip .ic{color:var(--ink-3);flex:none}
.ctxchip.main:hover{border-color:color-mix(in srgb,var(--ink) 25%,transparent)}
.ctxchip button{border:0;background:none;color:var(--ink-3);cursor:pointer;font-size:15px;line-height:1;padding:0 0 1px 2px}
.ctxchip button:hover{color:var(--ink)}
.ask-send{width:30px;height:30px;border-radius:50%;border:0;background:color-mix(in srgb,var(--ink) 9%,transparent);color:var(--ink-3);display:grid;place-items:center;cursor:pointer;flex:none;margin-left:auto;transition:background .15s,color .15s,transform .15s}
.ask-send.ready{background:var(--ink);color:var(--bg)}
.ask-send.ready:active{transform:scale(.92)}
.ask-send.stop{background:var(--ink);color:var(--bg)}

/* Tick perches on the composer's top edge and says what he's doing */
.perch{position:absolute;left:18px;top:-32px;z-index:2;display:flex;align-items:flex-end;gap:8px;pointer-events:none}
.perch .tick{pointer-events:auto;cursor:default}
.say{font:600 12px/1 var(--f-body);color:var(--bg);background:var(--ink);padding:7px 10px;border-radius:9px 9px 9px 3px;margin-bottom:18px;white-space:nowrap;max-width:270px;overflow:hidden;text-overflow:ellipsis;box-shadow:0 4px 14px rgba(0,0,0,.14);opacity:0;transform:translateY(4px) scale(.96);transform-origin:left bottom;transition:opacity .2s,transform .25s cubic-bezier(.2,.8,.2,1)}
.say.on{opacity:1;transform:none}
.say.err{background:var(--down);color:#fff}

/* menus */
.ask-menu{position:absolute;z-index:6;background:var(--panel);border:1px solid var(--rule);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.16),0 1px 3px rgba(0,0,0,.06);padding:6px;width:300px;max-width:calc(100vw - 28px);max-height:62vh;overflow:auto;animation:rise .18s cubic-bezier(.2,.8,.2,1) both}
.provm{left:10px;top:48px}
.ctxm{left:12px;bottom:calc(100% - 52px)}
.pop{left:12px;right:12px;width:auto;bottom:calc(100% + 6px);max-height:340px;padding:6px 6px 0}
.pop button.on{background:var(--tk-fill)}
.pop button[aria-disabled="true"]{opacity:.45}
.pop .pk{flex:none;min-width:48px;font:650 12.5px var(--f-body);color:var(--ink)}
.pop .pf{position:sticky;bottom:0;display:flex;gap:10px;align-items:center;margin:4px -6px 0;padding:8px 12px;border-top:1px solid var(--grid);background:var(--panel);font-size:11.5px;color:var(--ink-3)}
.pop .pf kbd{font-size:10.5px}
@media (hover:none){.pop .pf{display:none}.pop{padding-bottom:6px}}
.mtip{margin:2px 10px 8px;font-size:12.5px;color:var(--ink-3);line-height:1.45}
.ask-menu .mh{font:600 11px var(--f-body);color:var(--ink-3);padding:8px 10px 4px}
.ask-menu hr{border:0;border-top:1px solid var(--grid);margin:6px 4px}
.ask-menu button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;width:100%;border:0;background:none;text-align:left;padding:8px 10px;border-radius:9px;cursor:pointer;color:var(--ink)}
.ask-menu button:has(>.ic){flex-direction:row;align-items:center;gap:9px}
.ask-menu button:has(>.ic) .ic{color:var(--ink-3)}
.ask-menu button:hover:not(:disabled){background:var(--tk-fill)}
.ask-menu button[aria-checked="true"]{background:var(--tk-fill)}
.ask-menu button[aria-checked="true"] b::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--up);margin-left:7px;vertical-align:2px}
.ask-menu button:disabled{opacity:.5;cursor:default}
.ask-menu b{font-weight:600;font-size:13px}
.ask-menu small{font-size:12px;color:var(--ink-3)}
.ask-menu .pairbox{margin:6px 4px 4px}
.pop button:has(.pk){flex-direction:row;align-items:baseline;gap:10px}
.pop button small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

/* Tick himself: a rounded candle with a wick, two eyes with a glint, and a smile he saves for good news */
.tick{display:inline-grid;place-items:center;width:var(--s);height:var(--s);flex:none;--tk:#2fb877;--tk-2:#1f9a5f}
:root[data-theme="dark"] .tick{--tk:#4fd494;--tk-2:#2fae70}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tick{--tk:#4fd494;--tk-2:#2fae70}}
.tick svg{overflow:visible;display:block}
.tick .tk-w{stroke:var(--tk-2);stroke-width:2.4;stroke-linecap:round;fill:none}
.tick .tk-bd{fill:var(--tk);transition:fill .3s}
.tick .tk-sh{fill:#fff;opacity:.32}
.tick .tk-e ellipse{fill:#06140c}
.tick .tk-e circle{fill:#fff}
.tick .tk-m{fill:none;stroke:#06140c;stroke-width:1.5;stroke-linecap:round;opacity:0;transition:opacity .2s}
.tick .tk-b,.tick .tk-e{transform-box:fill-box;transform-origin:center}
.tick.tk-idle .tk-e{animation:tkblink 5.5s infinite}
.tick.tk-think .tk-b{animation:tkstretch 1.1s ease-in-out infinite;transform-origin:center bottom}
.tick.tk-think .tk-e{animation:tkread 1.6s ease-in-out infinite}
.tick.tk-done{animation:tkhop .55s cubic-bezier(.3,1.6,.5,1)}
.tick.tk-done .tk-m,.tick.tk-happy .tk-m{opacity:1}
.tick.tk-err .tk-bd{fill:var(--down)}
.perch .tick{filter:drop-shadow(0 3px 5px rgba(0,0,0,.16))}
.perch .tick.tk-idle{animation:tkbob 4s ease-in-out infinite}
@keyframes tkblink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}
@keyframes tkstretch{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.1)}}
@keyframes tkread{0%,100%{transform:translateX(-1.2px)}50%{transform:translateX(1.2px)}}
@keyframes tkhop{40%{transform:translateY(-6px)}}
@keyframes tkbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}
@media (prefers-reduced-motion:reduce){.tick *,.tick{animation:none!important}}
.askbtn .tick{margin:-2px 0}
.askbtn.ping{position:relative}
.askbtn.ping::after{content:"";position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;background:var(--up);box-shadow:0 0 0 2px var(--panel)}
body.tick-docked #askOpen{display:none}
body.tick-docked .bar-in{flex-wrap:nowrap}
body.tick-docked .live #status{display:none}
body.tick-docked .live{margin-left:auto}
@media (max-width:1500px){body.tick-docked .mainnav a{padding-inline:9px}}
.askbtn{gap:5px}

/* a new conversation: Tick speaks first */
.tk-hi{animation:rise .3s cubic-bezier(.2,.8,.2,1) both}
.tk-greet{font:650 17px/1.4 var(--f-body);letter-spacing:-.012em;color:var(--ink);margin:2px 0 4px;text-wrap:balance}
.tk-sub{color:var(--ink-3);font-size:13px;line-height:1.5;margin:0 0 16px;text-wrap:pretty}
.notes{display:grid;gap:6px;margin:0 0 22px}
.nt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;align-items:start;text-align:left;border:1px solid transparent;background:var(--tk-fill);border-radius:14px;padding:11px 12px;cursor:pointer;color:var(--ink);font:400 13.5px/1.45 var(--f-body);transition:border-color .15s,background .15s}
.nt:hover{border-color:var(--tk-line);background:var(--panel)}
.nt i{width:7px;height:7px;border-radius:50%;background:var(--ink-3);margin-top:6px}
.nt i.up{background:var(--up)}.nt i.down{background:var(--down)}.nt i.ev{background:var(--warn)}
.nt b{font-weight:650}.nt b.up{color:var(--up)}.nt b.down{color:var(--down)}
.nt em{grid-column:2;font-style:normal;font:500 12.5px var(--f-body);color:var(--ink-3);display:inline-flex;align-items:center;gap:2px;transition:color .15s}
.nt:hover em{color:var(--ink)}
.tk-lab{font:600 12px var(--f-body);color:var(--ink-3);margin:0 0 8px}
.pbs{display:flex;flex-wrap:wrap;gap:6px}
.pb{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--tk-line);background:var(--panel);border-radius:999px;padding:7px 12px;font:500 13px var(--f-body);color:var(--ink);cursor:pointer;transition:border-color .15s,background .15s,transform .15s}
.pb:hover{border-color:color-mix(in srgb,var(--ink) 24%,transparent);background:var(--tk-fill)}
.pb:active{transform:scale(.97)}
.pb .ic{color:var(--ink-3)}

/* the conversation */
.ctxsep{display:flex;align-items:center;gap:10px;margin:4px 0 16px;font:600 11px var(--f-body);color:var(--ink-3)}
.ctxsep::before,.ctxsep::after{content:"";flex:1;height:1px;background:var(--grid)}
.am{margin:0 0 22px;animation:rise .25s cubic-bezier(.2,.8,.2,1) both}
.am.u{display:flex;justify-content:flex-end}
.am.u p{margin:0;background:var(--tk-fill);border:1px solid var(--tk-line);border-radius:16px 16px 5px 16px;padding:9px 13px;max-width:86%;font-size:14px;line-height:1.5;text-wrap:pretty}
.log{display:grid;gap:8px;margin:0 0 12px}
.stp{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2);min-width:0}
.stp span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stp .sb{width:24px;height:22px;flex:none;border:1px solid var(--tk-line);border-radius:7px;display:grid;place-items:center;color:var(--ink-3)}
.stp.now{color:var(--ink)}
.stp.now .sb::before{content:"";width:10px;height:10px;border-radius:50%;border:1.6px solid var(--ink-3);border-top-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.how{margin:0 0 10px}
.how summary{list-style:none;display:inline-flex;align-items:center;gap:4px;cursor:pointer;padding:2px 0;font-size:13px;color:var(--ink-2)}
.how summary::-webkit-details-marker{display:none}
.how summary .ic{color:var(--ink-3);transition:transform .2s}
.how summary:hover{color:var(--ink)}
.how[open] summary .ic{transform:rotate(90deg)}
.how .log{margin:10px 0 4px}

/* conversations */
.hist-h{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px}
.hist h3{font:650 15px var(--f-body);margin:0}
.hist ul{list-style:none;margin:0 -8px;padding:0}
.hist li{display:flex;align-items:center;border-radius:12px;transition:opacity .18s,transform .18s,background .15s}
.hist li.gone{opacity:0;transform:translateX(12px)}

<body>
<header class="bar"><div class="wrap bar-in">
  <a class="brand" href="#market" data-page="market" aria-label="OpenTicker, market overview"><b>OpenTicker</b></a>
  <nav class="mainnav" id="mainnav" aria-label="Sections"></nav>
  <div class="srch"><input id="ts" type="search" placeholder="Search stocks, or jump to…" autocomplete="off" spellcheck="false" aria-label="Search tickers" aria-controls="sres"><kbd class="skbd">/</kbd><div class="sres" id="sres" role="listbox" hidden></div></div>
  <div class="live" title="Price feed status"><span class="dot" id="dot"></span><span id="status">Connecting…</span></div>
  <button class="theme bell iconbtn" id="bell" aria-label="Alerts"><svg class="ic" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></button>
  <button class="theme iconbtn" id="theme" title="Switch theme" aria-label="Switch theme"></button>
</div><div class="wrap toolbar" id="toolbar" hidden><div class="seg" id="funds" role="group" aria-label="Fund"></div><div class="seg" id="horizons" role="group" aria-label="Time range"></div></div><div class="tape" id="tape" hidden></div></header>

<main class="wrap" id="app"><div class="skel" aria-label="Loading"><i style="height:120px"></i><i style="height:300px"></i><i style="height:480px"></i><p class="hint" style="text-align:center">Loading holdings and price history. The first start takes about a minute.</p></div></main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true" aria-label="Stock detail"></aside>
<aside class="drawer" id="side2" aria-hidden="true" aria-label="Alerts"></aside>
<div class="tip" id="tip"></div>

<script>
/* ======================= icons ======================= */
const IC={bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>',
  moon:'<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
  auto:'<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18Z" fill="currentColor"/>',
  expand:'<path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>', shrink:'<path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/>',
  close:'<path d="M18 6 6 18M6 6l12 12"/>', plus:'<path d="M12 5v14M5 12h14"/>',
  star:'<path d="M12 2.5l2.94 5.96 6.56.95-4.75 4.63 1.12 6.54L12 17.5l-5.87 3.08 1.12-6.54L2.5 9.41l6.56-.95L12 2.5z"/>',
  market:'<path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 6-7"/>', funds:'<path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/>',
  mine:'<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>',
  calendar:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>', screener:'<path d="M3 6h18M6 12h12M10 18h4"/>',
  arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>', clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'};
const ic=(n,s=16,fill=false)=>`<svg class="ic" viewBox="0 0 24 24" width="${s}" height="${s}" fill="${fill?"currentColor":"none"}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]||""}</svg>`;

/* ======================= config & state ======================= */
const HZ=["1D","1W","1M","3M","6M","YTD","1Y"];
const FUND_ORDER=["SPY","QQQ","SMH","SOXX","Watchlist","Portfolio"];
const HEAT={"1D":.03,"1W":.06,"1M":.12,"3M":.2,"6M":.3,"YTD":.4,"1Y":.5};   // return that maps to full color
const FILTERS=[["all","All"],["leaders","Beating fund"],["laggards","Lagging fund"],["highs","Near 52-wk high"],["lows","Near 52-wk low"],["below200","Below 200-day"]];
let base=null, liveInfo=null, model=null, fundStats={};
let fund=load("fund","SPY"), hz=load("hz","1M"), sel=null, drawerOpen=false;
let sortKey="c", sortDir=-1, query="", filter="all", showAll=false, flashes={}, lastRender=0;

function load(k,d){try{return localStorage.getItem("idx."+k)||d}catch(e){return d}}
function save(k,v){try{localStorage.setItem("idx."+k,v)}catch(e){}}
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sgn=x=>x>0?"+":x<0?"−":"";
const pct=(x,d=2)=>x==null||!isFinite(x)?"–":sgn(x)+Math.abs(x*100).toFixed(d)+"%";
const pp=(x,d=2)=>x==null||!isFinite(x)?"–":sgn(x)+Math.abs(x).toFixed(d)+" pp";
const cls=x=>x==null?"flat":x>0?"up":x<0?"down":"flat";
const money=x=>x==null?"–":"$"+(x>=1000?x.toLocaleString("en-US",{maximumFractionDigits:0}):x.toFixed(2));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const trunc=(s,n)=>s&&s.length>n?s.slice(0,n-1)+"…":s;

/* ======================= math ======================= */
function startIndex(dates,h){
  const n=dates.length-1; if(n<1) return 0;
  if(h==="1D") return n-1;
  const last=new Date(dates[n]+"T00:00:00Z"); let t=new Date(last);
  if(h==="YTD") t=new Date(Date.UTC(last.getUTCFullYear(),0,1)-86400000);
  if(h==="1W") t.setUTCDate(t.getUTCDate()-7);
  if(h==="1M") t.setUTCMonth(t.getUTCMonth()-1);
  if(h==="3M") t.setUTCMonth(t.getUTCMonth()-3);
  if(h==="6M") t.setUTCMonth(t.getUTCMonth()-6);
  if(h==="1Y") t.setUTCFullYear(t.getUTCFullYear()-1);
  const s=t.toISOString().slice(0,10); let i=n; while(i>0&&dates[i]>s) i--; return i;
}
function firstValid(a,i){ if(!a) return null; for(let k=i;k<a.length;k++) if(a[k]!=null) return {k,v:a[k]}; return null; }
function lastValid(a){ if(!a) return null; for(let k=a.length-1;k>=0;k--) if(a[k]!=null) return a[k]; return null; }
function ret(a,i0){ const s=firstValid(a,i0), e=lastValid(a); return s&&e?{r:e/s.v-1,late:s.k>i0}:{r:null,late:false}; }
function avgLast(a,n){ let s=0,c=0; for(let k=a.length-1;k>=0&&c<n;k--) if(a[k]!=null){s+=a[k];c++;} return c>=n*0.8?s/c:null; }
function range52(a){ let hi=-Infinity,lo=Infinity,c=0; for(let k=a.length-1;k>=0&&c<252;k--,c++) if(a[k]!=null){hi=Math.max(hi,a[k]);lo=Math.min(lo,a[k]);} return isFinite(hi)?{hi,lo}:null; }

const startCache={};
function idx(h){ const key=h+base.dates.length+base.dates[base.dates.length-1]; return startCache[key]??(startCache[key]=startIndex(base.dates,h)); }

/* per-symbol facts that don't depend on fund */
function facts(t){
  const a=base.px[t]; if(!a) return null;
  const last=lastValid(a), prev=a.length>1?(()=>{for(let k=a.length-2;k>=0;k--) if(a[k]!=null) return a[k]; return null;})():null;
  const rets={}; HZ.forEach(h=>rets[h]=ret(a,idx(h)).r);
  const rg=range52(a), ma50=avgLast(a,50), ma200=avgLast(a,200);
  return {last,chg:prev&&last?last/prev-1:null,rets,hi:rg?.hi,lo:rg?.lo,offHi:rg?last/rg.hi-1:null,pos:rg&&rg.hi>rg.lo?(last-rg.lo)/(rg.hi-rg.lo):null,
    ma50,ma200,vs50:ma50?last/ma50-1:null,vs200:ma200?last/ma200-1:null};
}

function compute(){
  const f=base.funds[fund], i0=idx(hz), ff=facts(fund), R=ff?.rets[hz];
  const sectors=base.sectors||{};
  let rows=f.holdings.map(h=>{
    const F=facts(h.t)||{rets:{}}; const {r,late}=ret(base.px[h.t],i0);
    const ex={}; HZ.forEach(k=>ex[k]=F.rets[k]!=null&&ff.rets[k]!=null?(1+F.rets[k])/(1+ff.rets[k])-1:null);
    return {...F,t:h.t,n:h.n,w:h.w,r,late,ex,exh:ex[hz],sector:sectors[h.t]||"Unclassified"};
  });
  const sumW=rows.reduce((a,x)=>a+x.w,0);
  const raw=rows.map(x=>x.r==null?x.w:x.w/(1+x.r)), rs=raw.reduce((a,b)=>a+b,0);
  rows.forEach((x,i)=>{x.w0=raw[i]*sumW/rs; x.c=x.r==null?0:x.w0*x.r;});
  const sumC=rows.reduce((a,x)=>a+x.c,0), Rpp=R==null?null:R*100;
  if(!f.complete&&Rpp!=null) rows.push({t:"Other",n:"Rest of fund (not itemised)",w:100-sumW,w0:100-sumW,r:null,c:Rpp-sumC,exh:null,ex:{},rets:{},sector:"Other",other:true});
  rows.forEach(x=>x.share=Rpp?x.c/Rpp:null);
  const ranked=rows.filter(r=>!r.other&&r.r!=null).sort((a,b)=>a.r-b.r);
  ranked.forEach((r,i)=>r.rs=Math.round(1+98*i/Math.max(1,ranked.length-1)));
  const items=rows.filter(r=>!r.other&&r.r!=null);
  const ew=items.length?items.reduce((a,r)=>a+r.r,0)/items.length:null;
  const withTrend=items.filter(r=>r.vs50!=null), with200=items.filter(r=>r.vs200!=null);
  const st={
    up:items.filter(r=>r.r>0).length, n:items.length,
    beat:items.filter(r=>r.exh>0), ew,
    above50:withTrend.filter(r=>r.vs50>0).length/Math.max(1,withTrend.length),
    above200:with200.filter(r=>r.vs200>0).length/Math.max(1,with200.length),
    nearHi:items.filter(r=>r.offHi!=null&&r.offHi>-0.02).length,
    nearLo:items.filter(r=>r.lo&&r.last<=r.lo*1.02).length,
  };
  st.beatW=st.beat.reduce((a,r)=>a+r.w,0)/sumW;
  const sign=Math.sign(Rpp||0)||1;
  st.drivers=[...items].sort((a,b)=>sign*(b.c-a.c)).slice(0,5);
  st.top5=st.drivers.reduce((a,r)=>a+r.c,0);
  st.top10w=[...items].sort((a,b)=>b.w-a.w).slice(0,10).reduce((a,r)=>a+r.w,0);
  return {f,R,Rpp,ff,rows,items,sumC,sumW,i0,st};
}

/* fund-level stats for the pulse strip (all four funds, current horizon) */
function computePulse(){
  const out={};
  FUND_ORDER.forEach(k=>{
    const f=base.funds[k]; if(!f) return;
    const i0=idx(hz), r=ret(base.px[k],i0).r;
    const rs=f.holdings.map(h=>ret(base.px[h.t],i0).r).filter(v=>v!=null);
    const ew=rs.length?rs.reduce((a,b)=>a+b,0)/rs.length:null;
    out[k]={r,ew,up:rs.filter(v=>v>0).length,n:rs.length,spark:series(base.px[k],i0)};
  });
  return out;
}
function series(a,i0,maxPts=80){ if(!a) return []; const s=firstValid(a,i0); if(!s) return []; const pts=[]; for(let k=s.k;k<a.length;k++) if(a[k]!=null) pts.push([k,a[k]/s.v-1]); if(pts.length<=maxPts) return pts; const step=pts.length/maxPts, out=[]; for(let j=0;j<maxPts;j++) out.push(pts[Math.floor(j*step)]); out.push(pts[pts.length-1]); return out; }

/* ======================= render: shell ======================= */
function renderControls(){
  $("#funds").innerHTML=(PAGE_FUNDS[page]||[]).filter(k=>base?.funds[k]).map((k,i)=>`<button aria-pressed="${k===fund}" data-f="${k}" title="${esc(base.funds[k].name)} (key ${i+1})">${k}</button>`).join("");
  $("#horizons").innerHTML=HZ.map(k=>`<button aria-pressed="${k===hz}" data-h="${k}">${k}</button>`).join("");
}
function buildShell(){
  const mine=page==="mine";
  $("#app").innerHTML=`
  <section class="pulse" id="pulse"></section>
  <nav class="subnav" id="subnav">${mine?`<a href="#s-brief" class="on">Brief</a><a href="#s-mine">Positions</a><a href="#s-xray">X-ray</a><a href="#s-overview">Performance</a>`:`<a href="#s-overview" class="on">Overview</a>`}<a href="#s-map">Map &amp; drivers</a><a href="#s-earn">Earnings</a>${mine?"":`<a href="#s-leaders">Leadership</a>`}<a href="#s-holdings">Holdings</a></nav>
  <section class="panel" id="s-brief" hidden></section>
  <section class="panel" id="s-mine" hidden></section>
  <section class="panel" id="s-xray" hidden></section>
  <section class="hero" id="s-overview"><div><div class="eyebrow" id="heroEyebrow"></div><div class="big-r" id="heroR"></div><div class="big-sub" id="heroSub"></div><div class="read" id="read"></div></div><div class="hchart"><div class="legend" id="heroLeg"></div><div id="heroChart"></div></div></section>
  <section class="kpis" id="kpis"></section>
  <section class="panel" id="s-earn"><div class="ph"><div><h2>Earnings: last week to two weeks out</h2></div></div><div id="earnCal"></div></section>
  <section class="row" id="s-map">
    <div class="panel"><div class="ph"><div><h2 id="mapTitle">Market map</h2><div class="hint">Each tile is a holding, sized by its weight in the fund and colored by its return. Grouped by sector.</div></div><div class="legend"><span class="num" id="rampLo"></span><span class="ramp"></span><span class="num" id="rampHi"></span></div></div><div class="map" id="map"></div></div>
    <div class="panel"><div class="ph"><div><h2 id="barsTitle">What moved the fund</h2><div class="hint">Contribution to the fund's return in percentage points (start weight × return).</div></div></div><div id="bars"></div></div>
  </section>
  <section class="row even" id="s-leaders">
    <div class="panel"><div class="ph"><div><h2>Leadership across time frames</h2><div class="hint">The 20 largest holdings. Each cell is the stock's return relative to the fund over that period, so green means it led. RS is its return rank within the fund for the selected range (99 = best).</div></div></div><div class="mx-wrap" id="matrix"></div></div>
    <div class="panel"><div class="ph"><div><h2>Rotation</h2><div class="hint">Relative strength vs the fund over 3 months (across) against the last month (up). Leaders sit top right; names rolling over drift down; recoveries climb on the left.</div></div></div><div id="rotation"></div></div>
  </section>
  <section class="panel" id="s-holdings"><div class="ph"><div><h2>All holdings</h2><div class="hint" id="tblHint"></div></div><div class="tools"><div class="filters" id="filters"></div><input type="search" id="q" placeholder="Filter by ticker, name or sector" aria-label="Filter holdings"></div></div><div class="tbl-wrap"><table class="hold" id="tbl"></table></div><div id="moreWrap"></div></section>
  <section class="keys"><span><kbd>1</kbd>–<kbd>4</kbd> switch fund</span><span><kbd>←</kbd> <kbd>→</kbd> time range</span><span><kbd>/</kbd> search any ticker</span><span><kbd>F</kbd> full-screen stock view</span><span><kbd>Esc</kbd> close detail</span></section>
  <p class="note" id="note"></p>`;
  $("#q").addEventListener("input",e=>{query=e.target.value.trim().toLowerCase();renderTable();});
}

function render(){
  if(!base) return;
  renderNav(); buildPseudo();
  if(!isDash()){
    model=compute();
    const built={market:"#mkt",calendar:"#cal",screener:"#scr"}[page];
    if(page==="market"||!$(built)) renderPage();
    if(drawerOpen) renderDrawer(); lastRender=Date.now(); return;
  }

function spark(pts,w=240,h=38,color){
  if(pts.length<2) return `<svg viewBox="0 0 ${w} ${h}"></svg>`;
  const ys=pts.map(p=>p[1]), lo=Math.min(0,...ys), hi=Math.max(0,...ys), pad=(hi-lo)*.1||.001;
  const k0=pts[0][0], k1=pts[pts.length-1][0];
  const X=k=>2+(w-6)*(k-k0)/Math.max(1,k1-k0), Y=v=>2+(h-4)*(1-(v-lo+pad)/(hi-lo+2*pad));
  const d=pts.map((p,j)=>(j?"L":"M")+X(p[0]).toFixed(1)+","+Y(p[1]).toFixed(1)).join("");
  const end=pts[pts.length-1];
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><line x1="0" x2="${w}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--rule)" stroke-dasharray="2 3"/><path d="${d}L${X(end[0])},${Y(0)}L${X(k0)},${Y(0)}Z" fill="${color}" opacity=".1"/><path d="${d}" fill="none" stroke="${color}" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>`;
}

/* ======================= market map (squarified treemap) ======================= */
function squarify(nodes,x,y,w,h){
  const out=[], total=nodes.reduce((a,n)=>a+n.v,0); if(total<=0||w<=0||h<=0) return out;
  const sc=w*h/total; let rest=nodes.map(n=>({n,a:n.v*sc}));
  while(rest.length){
    const sh=Math.min(w,h); const worst=r=>{const s=r.reduce((a,q)=>a+q.a,0),mx=Math.max(...r.map(q=>q.a)),mn=Math.min(...r.map(q=>q.a));return Math.max(sh*sh*mx/(s*s),s*s/(sh*sh*mn));};
    let row=[rest[0]],i=1; while(i<rest.length&&worst([...row,rest[i]])<=worst(row)){row.push(rest[i]);i++;}
    const s=row.reduce((a,q)=>a+q.a,0);
    if(w>=h){const cw=s/h;let cy=y;row.forEach(q=>{const ch=q.a/cw;out.push({n:q.n,x,y:cy,w:cw,h:ch});cy+=ch;});x+=cw;w-=cw;}
    else{const rh=s/w;let cx=x;row.forEach(q=>{const cw=q.a/rh;out.push({n:q.n,x:cx,y,w:cw,h:rh});cx+=cw;});y+=rh;h-=rh;}
    rest=rest.slice(i);
  }
  return out;
}

}

/* ======================= rotation quadrant ======================= */
function niceTicks(lo,hi,n){ const span=hi-lo,step0=span/n,mag=Math.pow(10,Math.floor(Math.log10(step0))); const step=[1,2,2.5,5,10].map(x=>x*mag).find(x=>span/x<=n)||mag*10; const out=[]; for(let v=Math.ceil(lo/step)*step;v<=hi+1e-12;v+=step) out.push(Math.abs(v)<1e-12?0:v); return out; }
function renderRotation(){
  let pts=model.rows.filter(r=>!r.other&&r.ex["3M"]!=null&&r.ex["1M"]!=null);
  pts=pts.sort((a,b)=>b.w-a.w).slice(0,fund==="SPY"?60:40);
  if(!pts.length){$("#rotation").innerHTML="";return;}
  const W=520,H=400,L=44,R=12,T=12,B=30;
  const xs=pts.map(r=>r.ex["3M"]), ys=pts.map(r=>r.ex["1M"]);
  const xm=Math.max(.05,...xs.map(Math.abs))*1.1, ym=Math.max(.03,...ys.map(Math.abs))*1.12;
  const X=v=>L+(W-L-R)*(v+xm)/(2*xm), Y=v=>T+(H-T-B)*(1-(v+ym)/(2*ym));
  const wmax=Math.max(...pts.map(r=>r.w)), rad=w=>3.5+10*Math.sqrt(w/wmax);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Rotation quadrant">`;
  const q=[[X(0),T,W-R-X(0),Y(0)-T,"var(--up)","Leading","end",W-R-6,T+14],[L,T,X(0)-L,Y(0)-T,"var(--accent)","Improving","start",L+6,T+14],[L,Y(0),X(0)-L,H-B-Y(0),"var(--down)","Lagging","start",L+6,H-B-8],[X(0),Y(0),W-R-X(0),H-B-Y(0),"var(--warn)","Weakening","end",W-R-6,H-B-8]];
  q.forEach(([x,y,w,h,c,l,a,tx,ty])=>{s+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c}" opacity=".05"/><text x="${tx}" y="${ty}" font-size="11" font-weight="700" letter-spacing=".08em" text-anchor="${a}" fill="${c}">${l.toUpperCase()}</text>`;});
  niceTicks(-xm,xm,4).forEach(t=>{s+=`<text x="${X(t)}" y="${H-B+16}" font-size="10.5" text-anchor="middle" class="mono" fill="var(--ink-3)">${pct(t,0)}</text>`;});
  niceTicks(-ym,ym,4).forEach(t=>{s+=`<text x="${L-6}" y="${Y(t)+4}" font-size="10.5" text-anchor="end" class="mono" fill="var(--ink-3)">${pct(t,0)}</text>`;});
  s+=`<line x1="${X(0)}" x2="${X(0)}" y1="${T}" y2="${H-B}" stroke="var(--ink-3)"/><line x1="${L}" x2="${W-R}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--ink-3)"/>`;
  s+=`<text x="${W-R}" y="${H-3}" font-size="10.5" text-anchor="end" fill="var(--ink-3)">3-month vs ${fund} →</text><text x="${L}" y="${H-3}" font-size="10.5" fill="var(--ink-3)">↑ 1-month vs ${fund}</text>`;
  const quadColor=r=>r.ex["3M"]>=0?(r.ex["1M"]>=0?"var(--up)":"var(--warn)"):(r.ex["1M"]>=0?"var(--accent)":"var(--down)");
  [...pts].reverse().forEach(r=>{const on=r.t===sel;
    s+=`<g data-sel="${esc(r.t)}" data-tip="${esc(`<b>${r.t}</b> · ${r.n}<br>3M vs fund ${pct(r.ex["3M"])}<br>1M vs fund ${pct(r.ex["1M"])}<br>Weight ${r.w.toFixed(2)}%`)}"><circle cx="${X(r.ex["3M"]).toFixed(1)}" cy="${Y(r.ex["1M"]).toFixed(1)}" r="${rad(r.w).toFixed(1)}" fill="${quadColor(r)}" fill-opacity="${on?.95:.6}" stroke="${on?"var(--ink)":"var(--panel)"}" stroke-width="${on?2:1.2}"/></g>`;});
  const lab=new Set(pts.slice(0,12).map(r=>r.t)); if(sel) lab.add(sel);
  pts.filter(r=>lab.has(r.t)).forEach(r=>{s+=`<text x="${X(r.ex["3M"])+rad(r.w)+3}" y="${Y(r.ex["1M"])+4}" font-size="11" class="mono" font-weight="600" fill="var(--ink)" pointer-events="none">${esc(r.t)}</text>`;});
  $("#rotation").innerHTML=s+"</svg>";
}

function chipBg(v){ if(v==null) return "transparent"; const p=Math.round(clamp(Math.abs(v)/HEAT[hz],0,1)*22)+4; return `color-mix(in oklab, ${v>=0?"var(--up)":"var(--down)"} ${p}%, transparent)`; }

  return d.toLocaleDateString("en-US",{...o,month:"short",day:"numeric"}); }

async function api(path,body){

function lots(t){ return (me?.positions||[]).filter(p=>p.t===t); }
function positionsAgg(){
  const m=new Map();
  (me?.positions||[]).forEach(p=>{ const e=m.get(p.t)||{t:p.t,shares:0,costTotal:0,lots:0}; e.shares+=p.shares; e.costTotal+=p.shares*p.cost; e.lots++; m.set(p.t,e); });
  return [...m.values()].map(e=>({...e,avg:e.shares?e.costTotal/e.shares:0}));
}
/* build the two personal "funds" from your data, with an index series so all the fund math works */
function buildPseudo(){
  if(!base) return;
  const n=base.dates.length, nm=t=>nameOf(t);
  const mk=(key,items,weightOf)=>{
    const live=items.filter(x=>base.px[x.t]&&lastValid(base.px[x.t])!=null);
    const vals=live.map(weightOf), tot=vals.reduce((a,b)=>a+b,0)||1;
    base.funds[key]={name:PSEUDO[key],asOf:"live prices",complete:true,pseudo:true,
      holdings:live.map((x,i)=>({t:x.t,n:nm(x.t),w:vals[i]/tot*100}))};
    // chain-linked index: each day's return is the weighted return of what was priced on both days
    const idx=new Array(n).fill(null); let lvl=null;
    for(let k=0;k<n;k++){
      let num=0,den=0;
      if(k>0) live.forEach((x,i)=>{ const a=base.px[x.t], p0=a[k-1], p1=a[k]; if(p0!=null&&p1!=null){ const sz=key==="Portfolio"?x.shares*p0:1; num+=sz*(p1/p0-1); den+=sz; } });
      const any=live.some(x=>base.px[x.t][k]!=null);
      if(lvl==null){ if(any) lvl=100; } else if(den>0) lvl*=1+num/den;
      idx[k]=lvl==null?null:+lvl.toFixed(6);
    }
    base.px[key]=idx;
  };
  mk("Watchlist",(me?.watch||[]).map(t=>({t})),()=>1);
  mk("Portfolio",positionsAgg(),x=>x.shares*lastValid(base.px[x.t]));
}

     <table class="hz lots"><thead><tr><th>Lot</th><th>Shares</th><th>Cost</th><th>Gain</th><th></th></tr></thead><tbody>${L.map(p=>`<tr><td>${esc(p.opened||"–")}</td><td class="num">${+p.shares.toFixed(4)}</td><td class="num">${money(p.cost)}</td><td class="num ${cls(last-p.cost)}">${pct(p.cost?last/p.cost-1:null,1)}</td><td style="width:28px"><button class="lnk" data-pos-del="${p.id}" aria-label="Delete lot">✕</button></td></tr>`).join("")}</tbody></table>`:"")+
    `<form class="frm" id="drPF" ${formOpen?"":"hidden"}><input id="dS" type="number" step="any" min="0" placeholder="Shares" style="width:100px" required><input id="dC" type="number" step="any" min="0" placeholder="Cost per share" value="${last?last.toFixed(2):""}" style="width:130px" required><input id="dD" type="date" aria-label="Date bought (optional)"><button class="btn">Add lot</button><span class="err" id="dErr"></span></form>`;
  $("#drPF").onsubmit=posSubmit("d",r.t);
}
async function loadEarnHist(t){
  if(earnHist[t]&&(earnHist[t].loading||Date.now()-earnHist[t].at<6*3600e3)) return;
  earnHist[t]={loading:true};
  try{ const r=await fetch("/api/earnhist?t="+encodeURIComponent(t)); earnHist[t]={rows:r.ok?await r.json():null,at:Date.now()}; }catch(e){ earnHist[t]={rows:null,at:Date.now()-5.9*3600e3}; }
  if(drawerOpen&&sel===t){ renderEarnHist(); drawPriceChart(); }
}
function renderEarnHist(){
  const el=$("#drEH"); if(!el) return; const h=earnHist[sel];
  if(!h||h.loading){ el.innerHTML=`<div class="sk" style="height:120px"></div>`; return; }
  const today=base.dates[base.dates.length-1];
  const rows=(h.rows||[]).filter(x=>x.eps!=null&&x.date<=today).slice(0,8);
  if(!rows.length){ el.innerHTML=`<p class="hint" style="margin:0">${h.rows?"No past reports listed.":"Yahoo didn't return earnings history."}</p>`; return; }
  const rx=rows.map(x=>reaction(sel,x.date,x.hour)), valid=rx.filter(v=>v!=null), avg=valid.length?valid.reduce((a,v)=>a+Math.abs(v),0)/valid.length:null;
  const beats=rows.filter(x=>x.surprise!=null&&x.surprise>0).length;
  el.innerHTML=`<p class="hint" style="margin:0 0 8px">Beat estimates ${beats} of the last ${rows.length} times.${avg!=null?` The stock moved ${pct(avg,1).replace("+","±")} on average the session after.`:""}</p>
   <table class="hz"><thead><tr><th>Reported</th><th>EPS est.</th><th>Actual</th><th>Surprise</th><th>Next session</th></tr></thead><tbody>${rows.map((x,i)=>`<tr><td>${new Date(x.date+"T12:00:00Z").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"2-digit",timeZone:"UTC"})} <small style="color:var(--ink-3)">${x.hour<12?"☀":"☾"}</small></td><td class="num">${x.epsEst!=null?"$"+x.epsEst.toFixed(2):"–"}</td><td class="num">$${x.eps.toFixed(2)}</td><td class="num ${cls(x.surprise)}">${x.surprise!=null?pct(x.surprise/100,1):"–"}</td><td class="num ${cls(rx[i])}">${pct(rx[i],1)}</td></tr>`).join("")}</tbody></table>`;
}

/* ======================= ticker search ======================= */
let sItems=[], sIdx=-1, sTimer=null, sSeq=0;
function localMatches(q){
  const Q=q.toUpperCase(), m=new Map();
  FUND_ORDER.filter(f=>!isPseudo(f)).forEach(f=>(base?.funds[f]?.holdings||[]).forEach(h=>{ const e=m.get(h.t)||{t:h.t,n:h.n,funds:[]}; e.funds.push(`${f} ${h.w.toFixed(1)}%`); m.set(h.t,e); }));
  FUND_ORDER.filter(f=>!isPseudo(f)).forEach(f=>{ if(base?.funds[f]&&!m.has(f)) m.set(f,{t:f,n:base.funds[f].name,funds:["fund"]}); });
  (base?.extras||[]).forEach(t=>{ if(!m.has(t)) m.set(t,{t,n:searchNames[t]||detailCache[t]?.info?.longName||t,funds:[],exch:"recent"}); });
  const score=e=>{ const n=e.n.toUpperCase(); return e.t===Q?0:e.t.startsWith(Q)?1:n.startsWith(Q)?2:n.includes(Q)?3:9; };
  return [...m.values()].map(e=>[score(e),e]).filter(x=>x[0]<9).sort((a,b)=>a[0]-b[0]||a[1].t.length-b[1].t.length||a[1].t.localeCompare(b[1].t)).slice(0,6).map(x=>x[1]);
}
function showResults(){
  const el=$("#sres"); if(!sItems.length){ el.hidden=true; return; }
  el.hidden=false;
  el.innerHTML=sItems.map((e,i)=>e.cmd?`<button role="option" aria-selected="${i===sIdx}" data-cmd="${esc(e.cmd)}" class="cmd ${i===sIdx?"on":""}"><b>${ic(e.icon,15)}</b><span class="sn">${esc(e.label)}</span><span class="sf">${esc(e.hint)}</span></button>`
    :`<button role="option" aria-selected="${i===sIdx}" data-go="${esc(e.t)}" class="${i===sIdx?"on":""}"><b>${esc(e.t)}</b><span class="sn">${esc(e.n)}</span><span class="sf">${e.funds?.length?esc(e.funds.join(" · ")):esc(e.exch||"")}</span></button>`).join("");
}
function goTicker(t){ t=(t||"").trim().toUpperCase().replace(/[./ ]/g,"-"); if(!/^[A-Z][A-Z0-9-]{0,9}$/.test(t)) return; $("#ts").value=""; sItems=[]; showResults(); $("#ts").blur(); openDrawer(t); }
$("#ts").addEventListener("input",e=>{
  const q=e.target.value.trim(); sIdx=q?0:-1; const LM=q?localMatches(q):[], CM=q?commandMatches(q):[]; sItems=!q?quickItems():LM[0]&&LM[0].t===q.toUpperCase()?[LM[0],...CM,...LM.slice(1)]:[...CM,...LM]; if(q&&typeof withAsk==="function") sItems=withAsk(sItems,q); showResults(); clearTimeout(sTimer);
  if(!q) return; const seq=++sSeq;
  sTimer=setTimeout(async()=>{ try{ const rs=await (await fetch("/api/search?q="+encodeURIComponent(q))).json(); if(seq!==sSeq) return;
    const have=new Set(sItems.map(x=>x.t)); rs.forEach(x=>{ searchNames[x.t]=x.n; if(!have.has(x.t)&&sItems.length<9){ sItems.push(x); have.add(x.t); } }); if(typeof withAsk==="function") sItems=withAsk(sItems,q); if(sIdx<0&&sItems.length) sIdx=0; showResults(); }catch(err){} },220);
});
$("#ts").addEventListener("keydown",e=>{
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){ e.preventDefault(); if(!sItems.length) return; sIdx=(sIdx+(e.key==="ArrowDown"?1:-1)+sItems.length)%sItems.length; showResults(); }
  else if(e.key==="Enter"){ e.preventDefault(); const it=sItems[sIdx]; if(it?.cmd) runCmd(it); else goTicker(it?.t||e.target.value); }
  else if(e.key==="Escape"){ e.target.value=""; sItems=[]; showResults(); e.target.blur(); }
});
$("#ts").addEventListener("focus",e=>{ if(!e.target.value.trim()){ sItems=quickItems(); sIdx=-1; } showResults(); });

document.addEventListener("change",e=>{ const id=e.target.dataset?.alTog; if(id) api("/api/me/alert/toggle",{id:+id,on:e.target.checked}).catch(()=>{}); });

/* ======================= data plumbing ======================= */
async function getBase(){ const r=await fetch("/api/base"); const b=await r.json(); if(!me) await loadMe(); base=b; for(const k in startCache) delete startCache[k]; buildPseudo(); if(!base.funds[fund]) fund="SPY"; render();
  if(!hashDone){ hashDone=true; if(hashT) openDrawer(hashT); else setHash(); } }
async function poll(){
  try{
    const L=await (await fetch("/api/live")).json(); liveInfo=L;
    if(!base||L.v!==base.v) await getBase();
    else{
      let changed=false; const fl={};
      for(const [t,v] of Object.entries(L.last)){ const a=base.px[t]; if(!a||v==null) continue; const old=a[a.length-1]; if(old!==v){ a[a.length-1]=v; changed=true; if(old!=null) fl[t]=v>old?"flash-up":"flash-down"; } }
      if(changed){ flashes=fl; if(!document.hidden&&Date.now()-lastRender>4000) render(); }
    }
    setStatus(L);
  }catch(e){ $("#dot").className="dot warn"; $("#status").textContent="Can't reach the local server. Is run.sh still running?"; }
}
function setStatus(L){
  const age=L.lastTick?Math.round(L.now-L.lastTick):null,dot=$("#dot"),st=$("#status");
  const t=new Date().toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit",second:"2-digit"});
  if(age!=null&&age<90){dot.className="dot on";st.textContent=`Live · updated ${t}`;}
  else if(L.lastPoll&&L.now-L.lastPoll<180){dot.className="dot warn";st.textContent=`Stream quiet, polling · ${t}`;}
  else{dot.className="dot";st.textContent=`Market closed · as of ${shortDate(L.date)} close`;}
}
poll(); setInterval(poll,3000); setInterval(loadMe,30000);
